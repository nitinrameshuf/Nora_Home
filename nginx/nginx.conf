# Reverse proxy in front of Daphne. Terminates TLS, redirects plain HTTP,
# and passes the websocket upgrade through untouched — the wall and kiosk
# each hold a long-lived /ws/ connection to Channels for as long as they're
# on screen, which is most of the day.
#
# Mounted as /etc/nginx/conf.d/default.conf — the base nginx:alpine image's
# own nginx.conf already `include`s that directory from inside its http{}
# block, so this file only needs the server-level configuration.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nora_home {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/nora-home.crt;
    ssl_certificate_key /etc/nginx/certs/nora-home.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # A backup restore, or a big photo from the phone view, both go through
    # this proxy — the default 1m limit is too small for either.
    client_max_body_size 25m;

    location / {
        proxy_pass http://nora_home;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long-lived on purpose — a websocket that outlives nginx's default
        # 60s read timeout gets silently dropped mid-day otherwise.
        proxy_read_timeout 3600s;
    }
}
