<div class="card-head">
  <h3 class="card-title">{{ card.title }}</h3>
  <span class="pill">{{ count }}</span>
</div>
<ul class="item-list">
  {% for item in items %}
    <li class="item">
      <button class="tick" type="button" aria-label="Mark {{ item.trackable.title }} done"
              data-complete-url="{% url 'tracker:complete' item.uuid %}"></button>
      <div class="item-body">
        <div class="item-title">{{ item.trackable.title }}</div>
        <div class="item-meta">{{ item.due_at|time:"H:i" }} · {{ item.trackable.app_slug }}</div>
      </div>
    </li>
  {% empty %}
    <li class="item"><div class="item-body card-subtitle">Nothing due today. Enjoy it.</div></li>
  {% endfor %}
</ul>
