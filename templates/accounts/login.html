{% load static %}<!doctype html>
<html lang="en" data-surface="{{ surface }}" data-theme="dark" data-nh-bot="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ house_name }}</title>
  <link rel="stylesheet" href="{% static 'nora_home/css/nora-home.css' %}">
</head>
<body style="display:grid;place-items:center;min-height:100vh;padding:1.5rem">
  <main class="card" style="width:min(400px,100%)">
    <div class="brand" style="padding-bottom:1rem">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>{{ house_name }}</span>
    </div>

    {% if form.errors %}
      <p class="pill alert">That username and password don't match.</p>
    {% endif %}

    <form method="post" style="display:grid;gap:0.9rem">
      {% csrf_token %}
      <label>
        <span class="card-subtitle">Who are you?</span>
        {{ form.username }}
      </label>
      <label>
        <span class="card-subtitle">Password</span>
        {{ form.password }}
      </label>
      <button class="btn btn-primary" type="submit">Come in</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </main>
</body>
</html>
