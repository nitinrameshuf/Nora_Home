{% extends "base.html" %}

{% block content %}
  <div class="card-grid">
    {% for member in members %}
      <div class="card">
        <div class="card-head">
          <h3 class="card-title">{{ member.name }}</h3>
          <span class="pill">{{ member.get_role_display }}</span>
        </div>
        <p class="card-subtitle">
          {% if member.slack_user_id %}Slack linked{% else %}No Slack{% endif %} ·
          quiet {{ member.quiet_hours_start }}–{{ member.quiet_hours_end }}
        </p>
      </div>
    {% endfor %}
  </div>
{% endblock %}
