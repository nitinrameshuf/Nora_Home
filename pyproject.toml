[project]
name = "nora-home"
version = "0.1.0"
description = "Nora Home — the house operating system"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# QA tests drive a real browser against a running house — minutes, not seconds,
# and they need something to point at. They are opt-in via ./nora qa.
addopts = "--reuse-db --ignore=tests/qa"
markers = [
    "qa: drives a real browser against a running house (./nora qa)",
]
