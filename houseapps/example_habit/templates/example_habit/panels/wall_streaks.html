<div class="wall-agenda">
  {% for row in rows %}
    <div class="wall-agenda__member">
      <div class="wall-agenda__name">{{ row.streak }}</div>
      <div class="wall-agenda__item">{{ row.title }}</div>
      <div class="wall-agenda__when">
        {{ row.owner }}{% if row.done_today %} · done today{% endif %}
      </div>
    </div>
  {% empty %}
    <div class="wall-empty"><h1>No streaks running</h1></div>
  {% endfor %}
</div>
