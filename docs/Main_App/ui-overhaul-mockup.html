<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nora Home — UI overhaul, interactive mockup</title>

<!--
  Nora Home — THE UI/UX REFERENCE.

  This file is canonical for what a person sees. Any change to the interface is
  made HERE FIRST, shown, and approved before a line of production code is
  written. See CLAUDE.md §0's update table and §4. Phase 8 (Stories 43–55 on the
  dashboard) is the build that follows from it.

  Ground every list you add against the running app — `manage.py shell` over the
  registry, or settings.py — and say in a comment where the data came from. Four
  lists in this file were invented before being corrected that way, and a mockup
  showing plausible content is worse than none: it gets approved, then built.

  Standalone on purpose: open it with a double click. No server, no build, no
  network. Nothing talks to Django; every number is fixture data. The JS exists
  only to make the UX legible.

  WHAT CHANGED IN REVISION 2, and why
    * Dark only. The light theme is gone rather than rebuilt.
    * New identity: an arc-reactor HUD, for a robotics lab. Cyan core, emissive
      hairlines, corner brackets, monospace readouts. The ambient scene is now
      TIME OF DAY AND WEATHER ONLY -- season and the landscape are gone.
    * TWO layouts, not three. The 24" wall renders the *desktop* layout at the
      wall's own type ramp -- there is no separate "glance" design any more.
    * Widgets have real SIZE VARIANTS (S / M / L / XL). Each size is a designed
      state, not a stretched one, and the grid snaps to whole cells, so any
      rearrangement still tiles cleanly. Hit "Rearrange", then "Shuffle", to
      prove it.
    * The kiosk is a control surface for the 24" and nothing else: an action
      pad, three dials, a power row, and an app switcher. It deliberately shows
      no preview of the wall -- a miniature would be a second screen to read,
      and this panel is worked by hand while you look up at the wall itself.
-->

<style>
@layer proto, tokens, base, comp, work, kiosk, phone;

/* ═══════════════════════════════════════════════════════════
   PROTOTYPE CHROME — deliberately plain, so it never reads as
   part of the product.
   ═══════════════════════════════════════════════════════════ */
@layer proto {
  :root {
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --p-bg:#080b11; --p-raised:#111823; --p-line:#22303f;
    --p-text:#dceaf4; --p-dim:#7f9bb0; --p-arc:#38d6ff;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--p-bg); color:var(--p-text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  .bar {
    position:sticky; top:0; z-index:100; background:rgba(8,11,17,.95);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--p-line);
    padding:10px 18px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px;
  }
  .bar-brand { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--p-arc); font-weight:700; }
  .bar-brand small { display:block; color:var(--p-dim); font-weight:400; letter-spacing:.06em; text-transform:none; font-size:10px; margin-top:2px; }

  .grp { display:flex; align-items:center; gap:7px; }
  .grp > label { font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--p-dim); }

  .seg { display:flex; background:var(--p-raised); border:1px solid var(--p-line); border-radius:8px; overflow:hidden; }
  .seg button {
    appearance:none; border:0; background:transparent; cursor:pointer; color:var(--p-dim);
    font-family:var(--sans); font-size:12px; font-weight:600; padding:6px 11px;
    border-right:1px solid var(--p-line); white-space:nowrap;
  }
  .seg button:last-child { border-right:0; }
  .seg button[aria-pressed="true"] { background:var(--p-arc); color:#032430; }
  .seg button:hover:not([aria-pressed="true"]) { color:var(--p-text); background:#1a2431; }
  .seg button:focus-visible { outline:2px solid var(--p-arc); outline-offset:-2px; }

  .hint { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--p-dim); letter-spacing:.04em; }

  .stage { padding:26px 18px 70px; display:flex; flex-direction:column; align-items:center; gap:26px; }
  .frame { width:100%; max-width:1500px; }
  .frame-cap {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:var(--mono);
    font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--p-dim); margin-bottom:8px;
  }
  .frame-cap b { color:var(--p-text); letter-spacing:.09em; }
  .frame-cap em { font-style:normal; border:1px solid var(--p-line); border-radius:999px; padding:2px 9px; letter-spacing:.07em; }

  .screen {
    position:relative; overflow:hidden; border-radius:14px; border:1px solid var(--p-line);
    box-shadow:0 20px 50px rgba(0,0,0,.5); margin:0 auto;
  }
  .screen > .render { transform-origin:top left; }

  .pair { display:flex; gap:20px; align-items:flex-start; justify-content:center; flex-wrap:wrap; width:100%; max-width:1500px; }
  .pair .frame { flex:1 1 340px; min-width:0; max-width:none; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
}

/* ═══════════════════════════════════════════════════════════
   TOKENS — the arc-reactor system. Dark only, by decision.
   ═══════════════════════════════════════════════════════════ */
@layer tokens {
  .ui {
    /* ground */
    --void:#04070d; --deep:#070d16; --slab:#0b1520;

    /* the core: an emissive cyan, used sparingly and always as light */
    --arc-100:#e8fbff; --arc-300:#a5eeff; --arc-400:#7fe9ff;
    --arc-500:#38d6ff; --arc-600:#12a8d8; --arc-700:#0b7a9e;
    --glow:rgba(56,214,255,.45);
    --glow-soft:rgba(56,214,255,.16);

    /* semantic — separate from the core, never used as accent */
    --ok:#3ff0b0; --warn:#ffb648; --crit:#ff4d5e; --info:#7aa2ff;

    /* surfaces */
    --veil:rgba(4,8,14,.55);
    --panel:rgba(9,18,28,.62);
    --panel-solid:rgba(7,14,22,.93);
    --edge:rgba(120,200,235,.16);
    --edge-hot:rgba(56,214,255,.42);
    --hover:rgba(56,214,255,.09);

    /* ink */
    --txt:#e2f2fa; --dim:#9dbccf; --faint:#6a8ca2;

    /* ramp — one knob, three screens */
    --s0:13.5px; --s1:15px; --s2:20px; --s3:27px; --s4:40px;
    --lab:9.5px; --gap:14px; --pad:16px; --rad:12px; --tap:36px; --row:128px;
  }
  .ui[data-surface="phone"] { --s0:14px; --s1:16px; --s2:21px; --s3:27px; --s4:36px; --gap:12px; --pad:15px; --tap:44px; }
  /* The kiosk is an instrument you operate, not a surface you look at, so the
     scene recedes much further here than anywhere else — a bright sun disc
     landing on the power key is a control you cannot read. */
  .ui[data-surface="kiosk"] {
    --s0:14px; --s1:17px; --s2:22px; --s3:28px; --s4:38px; --lab:11px;
    --gap:12px; --pad:16px; --rad:14px; --tap:60px;
    --veil:rgba(3,6,11,.88);
  }
  .ui[data-surface="kiosk"] .orb { opacity:.28; }
  .ui[data-surface="kiosk"] .orb::after { opacity:.4; }
  /* The wall is the desktop layout, one ramp up. No separate design. */
  .ui[data-surface="wall"]  { --s0:18px; --s1:21px; --s2:28px; --s3:38px; --s4:60px; --lab:13px; --gap:20px; --pad:22px; --rad:16px; --tap:0px; --row:186px; }
}

@layer base {
  .ui {
    position:relative; overflow:hidden; height:100%;
    font-family:var(--sans); font-size:var(--s0); color:var(--txt); background:var(--void);
  }
  .ui * { box-sizing:border-box; }
  .ui button { font:inherit; color:inherit; cursor:pointer; }
  .ui :focus-visible { outline:2px solid var(--arc-500); outline-offset:2px; }

  /* ── the scene: time of day + weather only. No season, no landscape. ── */
  .scene { position:absolute; inset:0; z-index:0; overflow:hidden; }
  .sky { position:absolute; inset:0; transition:background .7s ease; }
  .ui[data-daypart="dawn"]  .sky { background:linear-gradient(180deg,#0a1a33,#2f5f86 34%,#c4763f 72%,#ffc478); }
  .ui[data-daypart="noon"]  .sky { background:linear-gradient(180deg,#0d3f74,#2f86c4 46%,#8fd0ee); }
  .ui[data-daypart="dusk"]  .sky { background:linear-gradient(180deg,#0a0e26,#3d2358 40%,#a1425c 70%,#e0763f); }
  .ui[data-daypart="night"] .sky { background:linear-gradient(180deg,#01030a,#050d1c 44%,#0c1c33); }

  /* veil sits over the scene and under all content, so a panel never has to
     carry legibility alone -- that is what forced panels opaque enough to
     erase the scene the last two times this was attempted. */
  /* Veil plus a bottom vignette. Removing the landscape exposed the sky's
     brightest band along the lower edge, which is exactly where content runs
     out — so a bare sun disc sat in the empty space under a short board. */
  .scene::after {
    content:""; position:absolute; inset:0;
    background-image: linear-gradient(var(--veil), var(--veil)),
                      linear-gradient(180deg, transparent 30%, rgba(2,5,10,.78) 100%);
  }

  .orb { position:absolute; border-radius:50%; transition:all .7s ease; }
  /* Halo is a %-sized ::after, never a vw box-shadow: each frame is a
     transform-scaled div, and vw resolves against the browser viewport. */
  .orb::after {
    content:""; position:absolute; left:50%; top:50%; translate:-50% -50%;
    width:460%; height:460%; border-radius:50%; z-index:-1;
    background:radial-gradient(circle, var(--halo,transparent) 0%, transparent 66%);
  }
  .ui[data-daypart="dawn"]  .orb { aspect-ratio:1; width:4.6%; left:16%; top:64%; --halo:rgba(255,190,120,.5);
    background:radial-gradient(circle,#fff6de,#ffc978 60%,#f09a4a); }
  .ui[data-daypart="noon"]  .orb { aspect-ratio:1; width:4.2%; left:52%; top:10%; --halo:rgba(255,240,190,.55);
    background:radial-gradient(circle,#ffffff,#fff0bc 58%,#ffd873); }
  .ui[data-daypart="dusk"]  .orb { aspect-ratio:1; width:5%; right:19%; left:auto; top:60%; --halo:rgba(255,140,80,.46);
    background:radial-gradient(circle,#ffe0b0,#ff9250 58%,#e05a2e); }
  .ui[data-daypart="night"] .orb { aspect-ratio:1; width:3.2%; right:15%; left:auto; top:11%; --halo:rgba(170,210,255,.34);
    background:radial-gradient(circle at 36% 34%,#f4f9ff,#c8d6ea 60%,#93a4bd); }

  .stars { position:absolute; inset:0; opacity:0; transition:opacity .7s ease; }
  .ui[data-daypart="night"] .stars { opacity:1; }
  .ui[data-daypart="dusk"]  .stars { opacity:.5; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#eaf4ff; }


  /* weather — turned well up from revision 1, which read as no weather at all */
  .wx { position:absolute; inset:0; pointer-events:none; }
  .cloud { position:absolute; border-radius:999px; background:rgba(226,240,250,.5); filter:blur(18px); animation:drift 58s linear infinite; }
  .ui[data-daypart="night"] .cloud { background:rgba(150,180,215,.3); }
  @keyframes drift { from{transform:translateX(-24%)} to{transform:translateX(124%)} }

  .drop { position:absolute; width:1.6px; height:22px; background:linear-gradient(rgba(190,225,255,0),rgba(200,232,255,.85)); animation:fall 1s linear infinite; }
  @keyframes fall { from{top:-6%} to{top:106%} }
  .flake { position:absolute; width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.92); animation:fall 7s linear infinite; }

  /* faint instrument grid + scanline — the lab, not the living room */
  .grid-o {
    position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:
      repeating-linear-gradient(0deg, rgba(120,200,235,.05) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(120,200,235,.05) 0 1px, transparent 1px 46px);
  }
  .scan { position:absolute; inset:0; pointer-events:none; opacity:.35;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }

  .layer { position:relative; z-index:1; height:100%; display:flex; }
}

/* ═══════════════════════════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════════════════════════ */
@layer comp {
  /* The panel: glass with an emissive hairline and corner brackets. */
  .panel {
    position:relative; background:var(--panel); backdrop-filter:blur(16px) saturate(1.25);
    border:1px solid var(--edge); border-radius:var(--rad);
  }
  .panel::before, .panel::after {
    content:""; position:absolute; width:11px; height:11px; pointer-events:none;
    border-color:var(--arc-500); opacity:.75;
  }
  .panel::before { top:-1px; left:-1px; border-top:1px solid; border-left:1px solid; border-top-left-radius:var(--rad); }
  .panel::after { bottom:-1px; right:-1px; border-bottom:1px solid; border-right:1px solid; border-bottom-right-radius:var(--rad); }

  .card {
    padding:var(--pad); display:flex; flex-direction:column; gap:9px;
    min-width:0; overflow:hidden; container-type:inline-size;
  }
  .ui[data-app] .card { background:var(--panel-solid); }

  .card-h { display:flex; align-items:center; gap:9px; flex:none; }
  .card-h h4 {
    margin:0; font-family:var(--mono); font-size:var(--lab); font-weight:700;
    letter-spacing:.15em; text-transform:uppercase; color:var(--arc-300);
  }
  .card-h .sub { font-size:calc(var(--s0)*.84); color:var(--faint); }
  .card-h .tools { margin-left:auto; display:flex; align-items:center; gap:4px; }
  .card-h .src { margin-left:auto; font-family:var(--mono); font-size:var(--lab); letter-spacing:.13em; text-transform:uppercase; color:var(--faint); }

  /* the size cycler, only in Rearrange mode */
  .szbtn {
    font-family:var(--mono); font-size:9.5px; font-weight:700; letter-spacing:.06em;
    border:1px solid var(--edge); background:transparent; color:var(--faint);
    border-radius:5px; padding:2px 6px; line-height:1.5;
  }
  .szbtn:hover { color:var(--arc-300); border-color:var(--edge-hot); }
  .szbtn[aria-pressed="true"] { background:var(--arc-500); border-color:var(--arc-500); color:#032430; }

  .body { flex:1; min-height:0; display:flex; flex-direction:column; gap:9px; justify-content:center; }
  .body.top { justify-content:flex-start; }

  /* readout — the arc-reactor number */
  .read { display:flex; align-items:baseline; gap:8px; }
  .read b {
    font-size:var(--s4); font-weight:600; letter-spacing:-.03em; line-height:1;
    font-variant-numeric:tabular-nums; color:var(--arc-100);
    text-shadow:0 0 18px var(--glow), 0 0 40px var(--glow-soft);
  }
  .read span { font-family:var(--mono); font-size:var(--s0); color:var(--dim); }
  .read.ok b { color:#c6fff0; text-shadow:0 0 18px rgba(63,240,176,.5); }
  .read.crit b { color:#ffd2d6; text-shadow:0 0 18px rgba(255,77,94,.5); }
  .cap { font-family:var(--mono); font-size:calc(var(--s0)*.84); color:var(--dim); letter-spacing:.03em; }

  /* emissive divider */
  .rule { height:1px; background:linear-gradient(90deg, transparent, var(--edge-hot), transparent); flex:none; }

  /* list */
  .row { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid rgba(120,200,235,.1); min-height:var(--tap); }
  .row:first-child { border-top:0; }
  .row .t { font-size:var(--s0); font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .d { margin-left:auto; font-family:var(--mono); font-size:calc(var(--s0)*.8); color:var(--faint); flex:none; }
  .row .d.late { color:var(--crit); font-weight:700; }
  .row.done .t { text-decoration:line-through; color:var(--faint); }

  .ck {
    width:18px; height:18px; border-radius:50%; flex:none; padding:0;
    border:1.6px solid var(--arc-700); background:transparent; display:grid; place-items:center;
  }
  .ck:hover { border-color:var(--arc-400); box-shadow:0 0 10px var(--glow-soft); }
  .ck.late { border-color:var(--crit); }
  .ck.on { background:var(--ok); border-color:var(--ok); box-shadow:0 0 12px rgba(63,240,176,.45); }
  .ck svg { width:10px; height:10px; opacity:0; color:#03291d; }
  .ck.on svg { opacity:1; }

  /* buttons */
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:8px;
    padding:7px 13px; font-size:calc(var(--s0)*.92); font-weight:600; white-space:nowrap;
    border:1px solid var(--edge); background:rgba(56,214,255,.06); color:var(--txt); min-height:var(--tap);
  }
  .btn:hover { border-color:var(--edge-hot); background:var(--hover); box-shadow:0 0 14px var(--glow-soft) inset; }
  .btn.pri {
    background:linear-gradient(180deg, var(--arc-400), var(--arc-600));
    border-color:var(--arc-400); color:#022430; font-weight:700;
    box-shadow:0 0 18px var(--glow);
  }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--dim); }
  .btn.ghost:hover { color:var(--txt); }
  kbd {
    font-family:var(--mono); font-size:calc(var(--s0)*.72); margin-left:6px;
    border:1px solid var(--edge); border-radius:4px; padding:1px 5px; color:var(--faint);
  }

  .chip {
    font-family:var(--mono); font-size:calc(var(--s0)*.8); padding:5px 12px; border-radius:999px;
    font-weight:600; letter-spacing:.07em; text-transform:uppercase;
    border:1px solid var(--edge); background:transparent; color:var(--dim);
  }
  .chip:hover { color:var(--arc-300); border-color:var(--edge-hot); }
  .chip[aria-pressed="true"] { background:var(--arc-500); border-color:var(--arc-500); color:#032430; }

  .empty {
    border:1px dashed var(--edge); border-radius:var(--rad); padding:16px; text-align:center;
    color:var(--faint); font-size:calc(var(--s0)*.88); display:flex; flex-direction:column; gap:6px; align-items:center;
  }
  .empty b { color:var(--dim); font-family:var(--mono); font-size:var(--lab); letter-spacing:.13em; text-transform:uppercase; }

  .badge {
    font-family:var(--mono); font-size:calc(var(--s0)*.74); padding:3px 8px; border-radius:4px;
    font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  }
  .badge.ok { background:rgba(63,240,176,.16); color:var(--ok); }
  .badge.warn { background:rgba(255,182,72,.16); color:var(--warn); }
  .badge.crit { background:rgba(255,77,94,.18); color:var(--crit); }

  /* sheet */
  .scrim { position:absolute; inset:0; z-index:40; background:rgba(2,5,10,.72); backdrop-filter:blur(4px); display:grid; place-items:center; padding:4%; }
  .sheet { width:min(460px,100%); background:var(--panel-solid); padding:22px; display:flex; flex-direction:column; gap:14px; box-shadow:0 0 60px rgba(0,0,0,.6), 0 0 40px var(--glow-soft); }
  .ui[data-surface="phone"] .scrim { align-items:flex-end; padding:0; }
  .ui[data-surface="phone"] .sheet { width:100%; border-radius:16px 16px 0 0; }
  .sheet h3 { margin:0; font-family:var(--mono); font-size:var(--s1); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--arc-300); }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-family:var(--mono); font-size:var(--lab); letter-spacing:.13em; text-transform:uppercase; color:var(--faint); }
  .field input, .field select {
    font:inherit; font-size:var(--s0); color:var(--txt); background:rgba(56,214,255,.06);
    border:1px solid var(--edge); border-radius:7px; padding:9px 11px; min-height:var(--tap);
  }
  /* A multi-select that reads as a dropdown but stays open while you tick.
     A native <select> means reopening it once per label, and on a touchscreen
     that is a modal wheel every time. */
  .lblwrap { position:relative; }
  .lbltrigger {
    width:100%; display:flex; align-items:center; gap:8px; text-align:left;
    font:inherit; font-size:var(--s0); color:var(--txt);
    background:rgba(56,214,255,.06); border:1px solid var(--edge-strong,var(--edge));
    border-radius:9px; padding:9px 11px; min-height:var(--tap);
  }
  .lbltrigger .caret { margin-left:auto; color:var(--faint); }
  .lbltrigger:hover { border-color:var(--edge-hot); }
  .lblmenu {
    position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:5;
    background:var(--panel-solid); border:1px solid var(--edge-hot);
    border-radius:10px; padding:6px; max-height:210px; overflow-y:auto;
    box-shadow:0 14px 34px rgba(0,0,0,.6);
  }
  .lblmenu[hidden] { display:none; }
  .lblrow {
    width:100%; display:flex; align-items:center; gap:10px; text-align:left;
    background:transparent; border:0; border-radius:7px; padding:8px 9px;
    color:var(--dim); font:inherit; font-size:calc(var(--s0)*.92); min-height:38px;
  }
  .lblrow:hover { background:var(--hover); color:var(--txt); }
  .lblrow .box {
    width:16px; height:16px; flex:none; border-radius:4px;
    border:1.5px solid var(--edge-hot); display:grid; place-items:center;
    font-size:11px; color:#032430;
  }
  .lblrow[aria-pressed="true"] { color:var(--arc-100); }
  .lblrow[aria-pressed="true"] .box { background:var(--arc-400); border-color:var(--arc-400); }
  .lblrow.new { color:var(--arc-300); border-top:1px solid var(--edge); margin-top:4px; }

  .sheet-foot { display:flex; gap:9px; justify-content:flex-end; margin-top:4px; }
  .sheet.wide { width:min(560px,100%); max-height:86%; overflow-y:auto; }
  .frow { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .switch { display:flex; align-items:flex-start; gap:10px; cursor:pointer;
            font-size:calc(var(--s0)*.88); color:var(--dim); line-height:1.45; }
  .switch input { width:18px; height:18px; flex:none; margin-top:1px; accent-color:var(--arc-500); }
  .ui[data-surface="phone"] .sheet.wide { max-height:82%; }

  .toast {
    position:absolute; left:50%; bottom:22px; translate:-50% 0; z-index:60;
    background:var(--panel-solid); border:1px solid var(--edge-hot); border-radius:999px;
    padding:9px 18px; font-family:var(--mono); font-size:calc(var(--s0)*.86); letter-spacing:.05em;
    box-shadow:0 0 24px var(--glow-soft);
  }
}

/* ═══════════════════════════════════════════════════════════
   WORK layout — phone, desktop, and the wall (same layout).
   ═══════════════════════════════════════════════════════════ */
@layer work {
  /* ── the console rail ──────────────────────────────────────
     Rebuilt: the first version was a flat grey text list, which
     belonged to a different design system than everything around
     it. This one is an instrument column — bracketed groups,
     each destination in its own framed cell, a live vitals block
     at the foot, and one clearly energised active state.        */
  .rail {
    width:228px; flex:none; padding:14px 12px 12px; display:flex; flex-direction:column;
    border-right:1px solid var(--edge-hot);
    background:linear-gradient(180deg, rgba(8,17,27,.86), rgba(5,11,19,.92));
    backdrop-filter:blur(20px) saturate(1.2);
    box-shadow:1px 0 0 rgba(56,214,255,.1), 14px 0 40px rgba(0,0,0,.45);
  }
  .ui[data-surface="wall"] .rail { width:296px; }

  .brand { display:flex; align-items:center; gap:11px; padding:2px 4px 16px; }
  .brand b {
    font-family:var(--mono); font-size:calc(var(--s0)*.9); font-weight:700;
    letter-spacing:.2em; text-transform:uppercase; color:var(--arc-100);
    text-shadow:0 0 16px var(--glow-soft);
  }

  /* group header: a label with a hairline that runs to the edge */
  .grp-lab {
    display:flex; align-items:center; gap:9px; padding:15px 4px 7px;
    font-family:var(--mono); font-size:var(--lab); letter-spacing:.2em;
    text-transform:uppercase; color:var(--arc-600); white-space:nowrap;
  }
  .grp-lab::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--edge-hot), transparent); }

  .nav {
    display:flex; align-items:center; gap:10px; padding:7px 9px 7px 10px; margin-bottom:3px;
    border-radius:8px; border:1px solid transparent; background:transparent; width:100%;
    text-align:left; min-height:var(--tap); position:relative; color:var(--dim);
    font-family:var(--mono); font-size:calc(var(--s0)*.82); font-weight:600;
    letter-spacing:.12em; text-transform:uppercase;
  }
  /* the icon sits in its own bracketed cell — the repeated module of the rail */
  .nav .ib {
    width:26px; height:26px; flex:none; display:grid; place-items:center; border-radius:6px;
    border:1px solid var(--edge); background:rgba(56,214,255,.05); color:var(--arc-300);
  }
  .nav svg { width:15px; height:15px; }
  .nav:hover { color:var(--txt); border-color:var(--edge); background:rgba(56,214,255,.05); }
  .nav:hover .ib { border-color:var(--edge-hot); }

  .nav[aria-current="page"] {
    color:var(--arc-100);
    background:linear-gradient(90deg, rgba(56,214,255,.22), rgba(56,214,255,.02));
    border-color:var(--edge-hot);
    box-shadow:0 0 22px var(--glow-soft);
  }
  /* the energised spine */
  .nav[aria-current="page"]::before {
    content:""; position:absolute; left:-1px; top:6px; bottom:6px; width:3px; border-radius:2px;
    background:var(--arc-400); box-shadow:0 0 12px var(--arc-500), 0 0 22px var(--glow);
  }
  .nav[aria-current="page"] .ib {
    background:linear-gradient(160deg, var(--arc-400), var(--arc-600));
    border-color:var(--arc-400); color:#032430; box-shadow:0 0 16px var(--glow);
  }

  .nav .n {
    margin-left:auto; font-family:var(--mono); font-size:calc(var(--s0)*.72);
    font-variant-numeric:tabular-nums; border-radius:4px; padding:2px 6px; font-weight:700;
    background:rgba(255,77,94,.18); color:var(--crit); border:1px solid rgba(255,77,94,.35);
  }
  .nav .n.calm { background:rgba(56,214,255,.12); color:var(--arc-300); border-color:var(--edge-hot); }

  /* ── vitals: the rail carries live state, not just links ── */
  .rail-foot { margin-top:auto; padding-top:12px; }
  .mewrap { position:relative; }
  .me .caret { margin-left:auto; color:var(--faint); font-size:10px; }
  .memenu {
    position:absolute; left:0; right:0; bottom:calc(100% + 6px); z-index:20;
    background:var(--panel-solid); border:1px solid var(--edge-hot); border-radius:11px;
    padding:6px; box-shadow:0 16px 40px rgba(0,0,0,.65); max-height:340px; overflow-y:auto;
  }
  .mehead, .melabel {
    font-family:var(--mono); font-size:var(--lab); letter-spacing:.14em;
    text-transform:uppercase; color:var(--faint); padding:8px 9px 5px;
  }
  .melabel { border-top:1px solid var(--edge); margin-top:4px; }
  .meopt {
    width:100%; display:flex; align-items:center; gap:9px; text-align:left;
    background:transparent; border:0; border-radius:8px; padding:8px 9px;
    color:var(--dim); font:inherit; font-size:calc(var(--s0)*.9);
    min-height:var(--tap); flex-wrap:wrap;
  }
  .meopt:hover { background:var(--hover); color:var(--txt); }
  .meopt em {
    flex-basis:100%; font-style:normal; font-size:calc(var(--s0)*.76);
    color:var(--faint); line-height:1.4;
  }
  .av.sm { width:22px; height:22px; font-size:10px; }
  .vitals { padding:9px 11px; margin-bottom:9px; display:flex; flex-direction:column; gap:5px; }
  .vit { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:calc(var(--s0)*.72); letter-spacing:.09em; }
  .vit .vk { color:var(--faint); text-transform:uppercase; width:32px; flex:none; }
  .vit .vv { color:#a5eeff; font-variant-numeric:tabular-nums; margin-left:auto;
             min-width:46px; text-align:right; }
  .vit .vbar { flex:1; height:3px; border-radius:2px; background:rgba(120,200,235,.14); overflow:hidden; }
  .vit .vbar i { display:block; height:100%; background:linear-gradient(90deg, var(--arc-600), var(--arc-400)); box-shadow:0 0 8px var(--glow); }
  .vit .vbar.warm i { background:linear-gradient(90deg, #b87a1e, var(--warn)); box-shadow:0 0 8px rgba(255,182,72,.5); }

  .me {
    display:flex; align-items:center; gap:10px; padding:8px 9px; border-radius:8px;
    border:1px solid var(--edge); background:rgba(56,214,255,.04); width:100%;
    text-align:left; min-height:var(--tap);
  }
  .me:hover { border-color:var(--edge-hot); background:var(--hover); }
  .me > span:not(.av) { flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; }
  .av {
    width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-family:var(--mono); font-size:11px; font-weight:700; color:#032430;
    background:linear-gradient(150deg, var(--arc-300), var(--arc-600)); box-shadow:0 0 14px var(--glow);
  }
  .me .who { font-family:var(--mono); font-size:calc(var(--s0)*.82); font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .me .role { font-family:var(--mono); font-size:calc(var(--s0)*.7); color:var(--faint); letter-spacing:.08em; }

  .work { flex:1; min-width:0; display:flex; flex-direction:column; }

  .appbar {
    display:flex; align-items:center; gap:11px; padding:11px 20px; flex:none;
    border-bottom:1px solid var(--edge); background:var(--panel); backdrop-filter:blur(18px);
  }
  .ui[data-app] .appbar { background:var(--panel-solid); }
  .appbar h1 { margin:0; font-family:var(--mono); font-size:var(--s2); font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--arc-100); text-shadow:0 0 22px var(--glow-soft); }
  .appbar .sp { flex:1; }

  .canvas { flex:1; padding:16px 20px; overflow:auto; min-height:0; }
  /* Inside an app the scene settles further back still: someone opened Todo to
     read a board, not to watch the sky. */
  .ui[data-app] .canvas { background:rgba(5,10,17,.72); }
  .ui[data-app] .orb { opacity:.45; }

  /* ── the grid. 12 columns, FIXED row height, so widgets snap to whole
     cells and any arrangement tiles without ragged gaps. ── */
  /* `dense` is load-bearing, not a flourish. Widget sizes rarely sum to a whole
     multiple of 12, so without it a wide widget that cannot fit the columns left
     in the current row drops to the next one and leaves an interior hole — the
     exact ragged grid this system exists to remove. Dense backfills those holes
     with later, smaller widgets. */
  .bento {
    display:grid; grid-template-columns:repeat(12,1fr);
    /* minmax(row, 1fr) rather than a fixed row height: with only a handful of
       widgets the rows share the leftover height instead of leaving the bottom
       40% of the screen empty — which was the original complaint reappearing
       in a new form. Below the minimum it scrolls as normal. */
    grid-auto-rows:minmax(var(--row), 1fr);
    grid-auto-flow:row dense; gap:var(--gap);
    min-height:100%; align-content:stretch;
  }
  .bento > .card { grid-column:span var(--c,3); grid-row:span var(--r,1); }

  .editing .card { outline:1px dashed var(--edge-hot); outline-offset:2px; }
  .editing .card:hover { outline-style:solid; box-shadow:0 0 26px var(--glow-soft); }

  /* board */
  .board { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); align-items:start; }
  .col { display:flex; flex-direction:column; gap:9px; }
  .col-h { display:flex; align-items:center; gap:8px; padding:0 3px 4px; }
  .col-h i { width:6px; height:6px; border-radius:50%; flex:none; }
  .col-h b { font-family:var(--mono); font-size:var(--lab); font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--dim); }
  .col-h .n { margin-left:auto; font-family:var(--mono); font-size:calc(var(--s0)*.8); color:var(--faint); font-variant-numeric:tabular-nums; }

  .task {
    background:var(--panel-solid); border:1px solid var(--edge); border-radius:10px;
    padding:11px 12px 11px 15px; display:flex; flex-direction:column; gap:9px;
    position:relative; overflow:hidden; text-align:left; width:100%;
  }
  .task::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; }
  .task[data-pri="1"]::before { background:var(--crit); box-shadow:0 0 12px var(--crit); }
  .task[data-pri="2"]::before { background:var(--warn); box-shadow:0 0 12px var(--warn); }
  .task[data-pri="3"]::before { background:var(--arc-500); box-shadow:0 0 12px var(--arc-500); }
  .task .tt { font-size:var(--s0); font-weight:600; line-height:1.34; }
  .task.done .tt { text-decoration:line-through; color:var(--faint); }
  .task .tm { display:flex; align-items:center; gap:8px; }
  .due { font-family:var(--mono); font-size:calc(var(--s0)*.76); padding:2px 7px; border-radius:4px; background:rgba(56,214,255,.09); color:var(--dim); font-variant-numeric:tabular-nums; }
  .due.late { background:rgba(255,77,94,.18); color:var(--crit); font-weight:700; }
  .assignee {
    margin-left:auto; width:21px; height:21px; border-radius:50%; display:grid; place-items:center;
    font-family:var(--mono); font-size:10px; font-weight:700; color:#032430; flex:none;
    background:linear-gradient(150deg, var(--arc-300), var(--arc-600));
  }

  /* ── ring gauge ── */
  .ring { position:relative; display:grid; place-items:center; width:100%; max-width:132px; margin:0 auto; }
  .ring svg { width:100%; height:auto; display:block; }
  .ring-c { position:absolute; inset:0; display:grid; place-content:center; text-align:center; gap:2px; }
  .ring-c b {
    font-size:var(--s2); font-weight:600; letter-spacing:-.02em; color:var(--arc-100);
    font-variant-numeric:tabular-nums; text-shadow:0 0 16px var(--glow-soft);
  }
  .ring-c span { font-family:var(--mono); font-size:calc(var(--s0)*.68); letter-spacing:.1em; color:var(--faint); }
  .body.row-split { flex-direction:row; align-items:center; gap:16px; }
  .body.row-split .ring { flex:none; width:96px; }

  /* ── board summary strip ── */
  .bstats { display:flex; gap:10px; margin-bottom:var(--gap); flex-wrap:wrap; }
  .bstat {
    flex:1; min-width:96px; padding:10px 13px; border-radius:10px;
    border:1px solid var(--edge); background:var(--panel-solid);
    display:flex; flex-direction:column; gap:2px;
  }
  .bstat b { font-size:var(--s2); font-weight:620; letter-spacing:-.02em; font-variant-numeric:tabular-nums; color:var(--arc-100); }
  .bstat span { font-family:var(--mono); font-size:calc(var(--s0)*.7); letter-spacing:.13em; text-transform:uppercase; color:var(--faint); }
  .bstat.crit b { color:var(--crit); } .bstat.warn b { color:var(--warn); } .bstat.ok b { color:var(--ok); }

  /* ── finished task card ── */
  .task .t-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .t-rep, .t-esc, .t-appr {
    display:inline-flex; align-items:center; gap:4px; font-family:var(--mono);
    font-size:calc(var(--s0)*.7); letter-spacing:.06em; padding:2px 6px; border-radius:4px;
  }
  .t-rep { color:var(--faint); background:rgba(120,200,235,.07); }
  .t-rep svg, .t-esc svg { width:11px; height:11px; }
  .t-esc { color:var(--warn); background:rgba(255,182,72,.14); font-weight:700; }
  .t-appr { color:var(--info); background:rgba(122,162,255,.14); }
  .task .t-foot { display:flex; align-items:center; gap:8px; padding-top:8px; border-top:1px solid rgba(120,200,235,.09); }
  .t-labels { display:flex; gap:5px; flex-wrap:wrap; flex:1; min-width:0; }
  .lab {
    font-family:var(--mono); font-size:calc(var(--s0)*.66); letter-spacing:.09em; text-transform:uppercase;
    padding:2px 7px; border-radius:999px; border:1px solid var(--edge); color:var(--dim);
  }

  /* ── search / labels / calendar ── */
  .srch {
    font:inherit; font-size:var(--s0); color:var(--txt); width:100%;
    background:rgba(56,214,255,.06); border:1px solid var(--edge);
    border-radius:8px; padding:10px 12px; min-height:var(--tap);
  }
  .srch:focus { border-color:var(--edge-hot); outline:none; box-shadow:0 0 18px var(--glow-soft); }
  .chips-row { display:flex; gap:7px; flex-wrap:wrap; }
  .lab-dot { width:9px; height:9px; border-radius:2px; flex:none; box-shadow:0 0 8px currentColor; }

  .cal { padding:var(--pad); display:flex; flex-direction:column; gap:8px; height:100%; }
  .cal-h { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-h span { font-family:var(--mono); font-size:var(--lab); letter-spacing:.15em;
                text-transform:uppercase; color:var(--faint); text-align:center; }
  .cal-g { flex:1; display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:1fr; gap:6px; min-height:0; }
  .cal-d {
    border:1px solid rgba(120,200,235,.1); border-radius:8px; padding:6px;
    display:flex; flex-direction:column; gap:4px; min-height:0; overflow:hidden;
    background:rgba(56,214,255,.03);
  }
  .cal-d.out { opacity:.25; }
  .cal-d.now { border-color:var(--arc-400); box-shadow:inset 0 0 20px var(--glow-soft); }
  .cal-n { font-family:var(--mono); font-size:calc(var(--s0)*.74); color:var(--faint); }
  .cal-d.now .cal-n { color:var(--arc-100); font-weight:700; }
  .cal-t {
    font-size:calc(var(--s0)*.72); border-radius:4px; padding:2px 5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    background:rgba(56,214,255,.16); border-left:2px solid var(--arc-500);
  }
  .cal-t[data-pri="1"] { background:rgba(255,77,94,.18); border-left-color:var(--crit); }
  .cal-t[data-pri="2"] { background:rgba(255,182,72,.16); border-left-color:var(--warn); }

  /* ── reporting: cumulative-flow bars ── */
  .cf { flex:1; display:flex; align-items:flex-end; gap:9px; padding-top:6px; min-height:0; }
  .cf-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:2px; position:relative; }
  .cf-col i { width:100%; border-radius:2px 2px 0 0; background:var(--arc-500); opacity:.85; }
  .cf-col i.b { position:absolute; bottom:16px; background:var(--ok); opacity:.9; width:52%; border-radius:2px 2px 0 0; }
  .cf-col span { font-family:var(--mono); font-size:calc(var(--s0)*.66); color:var(--faint); }
  .cf-key { display:flex; gap:16px; font-family:var(--mono); font-size:calc(var(--s0)*.7); color:var(--faint); letter-spacing:.09em; }
  .cf-key i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; }

  .set-row { display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid rgba(120,200,235,.1); min-height:var(--tap); }
  .set-row:first-child { border-top:0; }
  .set-row .k { font-size:var(--s0); font-weight:600; }
  .set-row .h { font-family:var(--mono); font-size:calc(var(--s0)*.78); color:var(--faint); }
  .set-row .v { margin-left:auto; font-family:var(--mono); font-size:calc(var(--s0)*.88); color:var(--dim); text-align:right; }
}

/* ═══════════════════════════════════════════════════════════
   KIOSK — a controller for the 24". Shows what the wall is
   displaying, controls it, and switches apps.
   ═══════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════
   THE DESK — the 10.1" as a piece of hardware, not a web page.

   Direction taken from Teenage Engineering's design language:
   monospace-only type, a tight palette, few well-placed keys and
   a rotary encoder, limitation treated as the aesthetic rather
   than apologised for. So: an encoder selects what the 24" shows,
   a bank of numbered illuminated keys fires that app's controls,
   and two faders handle zoom and alarm volume. Legends are
   screen-printed; nothing scrolls; everything is a thumb target.

   It scales the way hardware does — the encoder steps through any
   number of apps, and the key bank pages.
   ═══════════════════════════════════════════════════════════ */
@layer kiosk {
  .desk {
    flex-direction:column; width:100%; position:relative;
    background:
      linear-gradient(163deg, #16212c 0%, #0d151e 42%, #070d14 100%);
  }
  /* brushed-metal tooth, very low contrast */
  .desk::before {
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(97deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
  }
  .screw {
    position:absolute; width:11px; height:11px; border-radius:50%; z-index:4;
    background:radial-gradient(circle at 34% 30%, #33414f, #131c25 70%, #0a1119);
    box-shadow:inset 0 1px 1px rgba(190,220,240,.22), 0 1px 2px rgba(0,0,0,.7);
  }
  .screw::after {
    content:""; position:absolute; inset:0; margin:auto; width:7px; height:1.5px;
    background:#0a1119; border-radius:1px; transform:rotate(34deg);
  }
  .screw.tl{top:9px;left:9px} .screw.tr{top:9px;right:9px}
  .screw.bl{bottom:9px;left:9px} .screw.br{bottom:9px;right:9px}

  /* ── header: brand, dot-matrix readout, lamp ── */
  .d-head {
    display:flex; align-items:center; gap:14px; padding:11px 26px; flex:none;
    border-bottom:1px solid #06232e; position:relative; z-index:2;
    box-shadow:0 1px 0 rgba(150,210,240,.06);
  }
  .d-brand { display:flex; align-items:center; gap:9px; }
  .d-brand b {
    font-family:var(--mono); font-size:calc(var(--s0)*.86); font-weight:700;
    letter-spacing:.34em; text-transform:uppercase; color:#93b4c6;
  }
  .d-readout {
    margin-left:auto; display:flex; align-items:center; gap:11px;
    padding:6px 16px; border-radius:5px; background:#04090e;
    border:1px solid #0a1a23;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.85);
    position:relative; overflow:hidden;
  }
  /* the dot grid a real LED matrix would have */
  .d-readout::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle, rgba(0,0,0,.5) 32%, transparent 33%);
    background-size:3px 3px;
  }
  .d-readout span {
    font-family:var(--mono); font-size:calc(var(--s0)*.66); letter-spacing:.2em;
    color:#2c5c6d; text-transform:uppercase;
  }
  .d-readout b {
    font-family:var(--mono); font-size:var(--s1); letter-spacing:.24em;
    text-transform:uppercase; color:#7ff0ff; text-shadow:0 0 12px rgba(56,214,255,.9);
  }
  .d-lamp { display:flex; align-items:center; gap:7px; font-family:var(--mono);
            font-size:calc(var(--s0)*.68); letter-spacing:.18em; color:#3fd9a0; text-transform:uppercase; }
  .d-lamp i { width:9px; height:9px; border-radius:50%; background:#3ff0b0;
              box-shadow:0 0 10px #3ff0b0, inset 0 -1px 2px rgba(0,0,0,.4); }
  .d-lamp.lost { color:#ff6b78; }
  .d-lamp.lost i { background:#ff4d5e; box-shadow:0 0 10px #ff4d5e; }

  /* a powered-down wall: the readout goes dark and the keys have nothing to
     drive, so they read as unlit rather than pretending to work */
  .d-readout.off b { color:#2c5c6d; text-shadow:none; }
  /* One constant key size. auto-fill with a FIXED track, not 1fr — a bank of
     two keys should look like two keys, not two very wide keys. */
  /* ── panel layout (restored: a wide range-delete took these out) ── */
  .d-main { flex:1; display:grid; grid-template-columns:236px 1fr 84px; min-height:0; position:relative; z-index:2; }
  .d-col { display:flex; flex-direction:column; gap:10px; min-height:0; }
  .d-enc {
    border-right:1px solid #06232e; box-shadow:1px 0 0 rgba(150,210,240,.05);
    padding:14px 0 16px; display:flex; flex-direction:column; align-items:stretch;
    gap:10px; min-height:0;
  }
  .d-lab {
    font-family:var(--mono); font-size:calc(var(--s0)*.64); letter-spacing:.28em;
    text-transform:uppercase; color:#4e7284; flex:none; padding:0 14px;
  }
  .d-keys { padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; min-height:0; }
  .d-keys-h { display:flex; align-items:center; gap:10px; flex:none; }
  .d-keys-h .d-lab { padding:0; }
  .d-keys-h .bank {
    margin-left:auto; font-family:var(--mono); font-size:calc(var(--s0)*.62);
    letter-spacing:.16em; color:#4e7284; border:1px solid #17303c;
    border-radius:4px; padding:2px 8px;
  }
  .k-new {
    font-size:calc(var(--s0)*.6); letter-spacing:.13em; text-transform:uppercase;
    color:var(--warn); border:1px solid rgba(255,182,72,.45); border-radius:3px;
    padding:0 4px; margin-left:5px; font-weight:700;
  }

  /* the shared key body */
  .hkey {
    --key:#38d6ff;
    position:relative; border:1px solid rgba(120,200,235,.16); color:#dcecf5;
    background:linear-gradient(180deg, #101a24 0%, #0b131b 55%, #070d14 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-family:var(--mono); text-transform:uppercase; border-radius:9px;
    min-height:44px; padding:9px 8px;
    box-shadow:inset 0 1px 0 rgba(180,225,245,.09), 0 2px 0 #050b11, 0 5px 10px rgba(0,0,0,.5);
  }
  .hkey:hover { border-color:color-mix(in srgb, var(--key) 55%, transparent); }
  .hkey .num { position:absolute; top:6px; left:10px; font-size:calc(var(--s0)*.58); letter-spacing:.1em; }
  .hkey .led { position:absolute; top:8px; right:10px; width:7px; height:7px; border-radius:50%; background:var(--key); }
  .hkey .lg { font-size:calc(var(--s0)*.84); font-weight:700; letter-spacing:.1em; line-height:1.25; }

  .d-bank {
    flex:1; min-height:0; overflow-y:auto; display:grid; gap:11px;
    grid-template-columns:repeat(auto-fill, 148px);
    grid-auto-rows:92px; align-content:start; justify-content:start;
  }
  .d-bank .hkey { width:148px; height:92px; min-height:0; }
  /* the footer keys: same key, laid out along its width */
  .hkey.wide {
    flex-direction:row; gap:9px; height:56px; min-height:56px; padding:0 14px;
  }
  .hkey.wide svg { width:17px; height:17px; opacity:.9; }
  .hkey.wide .lg { font-size:calc(var(--s0)*.84); }
  /* the verb bank: same key, laid out in one row under the destinations */
  .d-acts { flex:none; display:flex; gap:11px; flex-wrap:wrap; }
  .d-acts .hkey { width:148px; height:56px; min-height:0; }
  .d-bank.dark { opacity:.42; }

  /* ── the wall's scroll control ──────────────────────────────────────
     The 24" has no input of its own, so moving its content up and down has
     to happen from here. Not in wall-live.js's vocabulary today — it
     implements navigate, refresh and banner only — so this is new platform
     work, marked accordingly and owned by Story 51. */
  .d-scroll {
    border-left:1px solid #06232e; box-shadow:-1px 0 0 rgba(150,210,240,.05);
    padding:14px 10px 16px; display:flex; flex-direction:column; align-items:center;
    gap:9px; min-height:0;
  }
  /* A pitch-bend wheel. Spring-centred: push it up or down to scroll the 24",
     let go and it returns. A rate control, not a position one — which is the
     right shape for driving a screen you are not touching. */
  .pbend {
    position:relative; flex:1; min-height:0; width:46px; border-radius:10px;
    border:1px solid #060d14; overflow:hidden; cursor:ns-resize;
    background:linear-gradient(180deg, #050b11, #0a121a 50%, #050b11);
    box-shadow:inset 0 4px 10px rgba(0,0,0,.9), inset 0 -4px 10px rgba(0,0,0,.9);
  }
  /* the centre detent it always comes back to */
  .pbend-detent {
    position:absolute; left:6px; right:6px; top:50%; height:1px; translate:0 -50%;
    background:var(--arc-500); opacity:.5; box-shadow:0 0 8px var(--arc-500); z-index:2;
  }
  .pwheel {
    position:absolute; left:4px; right:4px; height:78px; top:50%; margin-top:-39px;
    border-radius:7px; z-index:1;
    background:linear-gradient(180deg,
      #0d151d 0%, #26333f 14%, #33434f 50%, #26333f 86%, #0d151d 100%);
    border:1px solid #05090e;
    box-shadow:0 2px 8px rgba(0,0,0,.7), 0 0 16px rgba(56,214,255,.1);
    transition:transform .38s cubic-bezier(.22,1.4,.42,1);
    will-change:transform;
  }
  /* the ridges that make a mod wheel a mod wheel */
  .pwheel::after {
    content:""; position:absolute; inset:5px 7px; border-radius:3px;
    background:repeating-linear-gradient(180deg,
      rgba(190,225,245,.20) 0 1px, transparent 1px 5px);
  }
  .pbend.held .pwheel { transition:none; box-shadow:0 2px 8px rgba(0,0,0,.7), 0 0 26px var(--glow); }


  /* ── vertical app scroller ── */
  .vsel {
    position:relative; flex:1; width:100%; min-height:0; overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg, transparent, #000 16%, #000 84%, transparent);
            mask-image:linear-gradient(180deg, transparent, #000 16%, #000 84%, transparent);
  }
  /* the fixed selection band the column scrolls under */
  /* a slow sweep down the column */
  .vsel-scan {
    position:absolute; left:0; right:0; height:64px; z-index:0; pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(56,214,255,.09), transparent);
    animation:vscan 6s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes vscan { 0% { top:-64px; } 100% { top:100%; } }

  .vsel-band {
    position:absolute; left:0; right:0; top:50%; height:56px; translate:0 -50%;
    border-top:1px solid rgba(120,200,235,.22); border-bottom:1px solid rgba(120,200,235,.22);
    background:linear-gradient(90deg, rgba(56,214,255,.12), rgba(56,214,255,.02));
    pointer-events:none; z-index:0;
    animation:vband 3.4s ease-in-out infinite;
  }
  @keyframes vband {
    0%,100% { box-shadow:0 0 0 rgba(56,214,255,0), inset 0 0 18px rgba(56,214,255,.05); }
    50%     { box-shadow:0 0 22px rgba(56,214,255,.16), inset 0 0 26px rgba(56,214,255,.10); }
  }
  /* corner brackets, drawn on the band rather than the item so they stay put
     while the column scrolls under them */
  .vsel-band i {
    position:absolute; width:9px; height:9px; border:1.5px solid var(--arc-400);
    opacity:.85; filter:drop-shadow(0 0 4px var(--glow));
  }
  .vsel-band i:nth-child(1) { top:-1px; left:-1px; border-right:0; border-bottom:0; }
  .vsel-band i:nth-child(2) { top:-1px; right:-1px; border-left:0; border-bottom:0; }
  .vsel-band i:nth-child(3) { bottom:-1px; left:-1px; border-right:0; border-top:0; }
  .vsel-band i:nth-child(4) { bottom:-1px; right:-1px; border-left:0; border-top:0; }
  .vsel-list {
    position:relative; z-index:1; height:100%; overflow-y:auto; scroll-snap-type:y mandatory;
    display:flex; flex-direction:column; scroll-behavior:smooth;
  }
  .vsel-list::-webkit-scrollbar { width:0; }
  .vsel-i {
    flex:none; height:56px; scroll-snap-align:center; border:0; background:transparent;
    display:flex; align-items:center; gap:12px; padding:0 14px; width:100%; text-align:left;
    color:#5f7f92; font-family:var(--mono); font-size:calc(var(--s0)*.86);
    letter-spacing:.14em; text-transform:uppercase; opacity:.5;
  }
  .vsel-i .vsel-ic { position:relative; width:20px; height:20px; flex:none; display:grid; place-items:center; }
  /* a targeting ring that keeps turning on whichever app is live */
  .reticle {
    position:absolute; inset:-9px; border-radius:50%;
    border:1px dashed color-mix(in srgb, var(--arc-400) 70%, transparent);
    animation:spin 7s linear infinite;
  }
  .reticle::after {
    content:""; position:absolute; inset:3px; border-radius:50%;
    border:1px solid transparent; border-top-color:var(--arc-400);
    animation:spin 2.6s linear infinite reverse;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .vsel-i .vsel-ic svg { width:18px; height:18px; }
  .vsel-i .vsel-t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vsel-i:hover { opacity:.8; color:#a8c6d6; }
  .vsel-i { transition:opacity .25s ease, color .25s ease; }
  .vsel-i.on {
    opacity:1; color:#eaf7fd; font-weight:700;
    text-shadow:0 0 16px rgba(56,214,255,.5);
  }
  .vsel-i.on .vsel-ic { color:var(--arc-400); filter:drop-shadow(0 0 8px var(--glow)); }


  /* ── square keys ── */
  .d-bank {
    grid-template-columns:repeat(auto-fill, 128px); grid-auto-rows:128px; gap:12px;
  }
  .d-bank .hkey {
    width:128px; height:128px; border-radius:14px; border-width:1px;
    border-color:rgba(120,200,235,.16);
    background:linear-gradient(180deg,
      color-mix(in srgb, var(--key) 9%, #121c25) 0%,
      color-mix(in srgb, var(--key) 5%, #0b131b) 100%);
    box-shadow:inset 0 1px 0 rgba(180,225,245,.09), 0 2px 0 #050b11, 0 6px 14px rgba(0,0,0,.5);
    justify-content:center; align-items:center; padding:16px;
  }
  .d-bank .hkey .lg {
    text-align:center; color:#e2f1f8; font-size:calc(var(--s0)*.88); letter-spacing:.08em;
  }
  .d-bank .hkey .led {
    top:14px; right:14px; left:auto; width:10px; height:10px;
    box-shadow:0 0 10px var(--key);
  }
  .d-bank .hkey:hover {
    border-color:color-mix(in srgb, var(--key) 55%, transparent);
    box-shadow:inset 0 1px 0 rgba(180,225,245,.14), 0 2px 0 #050b11,
               0 0 20px color-mix(in srgb, var(--key) 25%, transparent);
  }
  .d-bank .hkey:active { transform:translateY(2px); }

  /* ── faders ── */
  .d-foot {
    flex:none; display:grid; grid-template-columns:1fr 1fr 132px 132px; gap:14px;
    padding:12px 22px 16px; border-top:1px solid #06232e;
    box-shadow:inset 0 1px 0 rgba(150,210,240,.06); position:relative; z-index:2; align-items:end;
  }
  .fader { display:flex; flex-direction:column; gap:5px; }
  .fader-hint {
    font-family:var(--mono); font-size:calc(var(--s0)*.58); letter-spacing:.06em;
    color:#3d5a6b; margin-top:-2px;
  }
  .fader-h { display:flex; align-items:baseline; gap:8px; }
  .fader-h span { font-family:var(--mono); font-size:calc(var(--s0)*.64); letter-spacing:.22em;
                  text-transform:uppercase; color:#4e7284; }
  .fader-h b { margin-left:auto; font-family:var(--mono); font-size:calc(var(--s0)*.86);
               color:#7ff0ff; font-variant-numeric:tabular-nums; text-shadow:0 0 10px rgba(56,214,255,.6); }
  .slot {
    position:relative; height:34px; border-radius:5px; padding:0; border:1px solid #060d14;
    background:linear-gradient(180deg, #060c12, #0b141c);
    box-shadow:inset 0 3px 6px rgba(0,0,0,.85);
  }
  /* the travel groove */
  .slot::before {
    content:""; position:absolute; left:12px; right:12px; top:50%; height:3px; translate:0 -50%;
    border-radius:2px; background:#04080d; box-shadow:inset 0 1px 2px rgba(0,0,0,.9);
  }
  .slot-fill {
    position:absolute; left:12px; top:50%; height:3px; translate:0 -50%; border-radius:2px;
    background:linear-gradient(90deg, #0b7a9e, #7fe9ff); box-shadow:0 0 10px var(--glow);
  }
  .fcap {
    position:absolute; top:3px; bottom:3px; width:26px; translate:-50% 0; border-radius:4px;
    background:linear-gradient(180deg, #2b3947 0%, #1a2531 50%, #101923 100%);
    border:1px solid #05090e;
    box-shadow:inset 0 1px 0 rgba(175,220,245,.3), 0 2px 5px rgba(0,0,0,.7);
  }
  /* grip lines on the fader knob */
  .fcap::after {
    content:""; position:absolute; inset:5px 7px; border-radius:1px;
    background:repeating-linear-gradient(180deg, rgba(150,200,225,.22) 0 1px, transparent 1px 4px);
  }

  /* the all-apps overlay, reached by pressing the encoder */
  .d-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:11px; }
}

/* ═══════════════════════════════════════════════════════════
   PHONE — kept from revision 1 (it worked), restyled.
   ═══════════════════════════════════════════════════════════ */
@layer phone {
  .ph { flex-direction:column; width:100%; }
  .ph-top { display:flex; align-items:center; gap:11px; padding:14px 16px 10px; flex:none; }
  .ph-top h1 { margin:0; font-family:var(--mono); font-size:var(--s2); font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--arc-100); }
  .ph-top .av { margin-left:auto; width:34px; height:34px; font-size:13px; border:0; }
  .ph-body { flex:1; padding:4px 16px 12px; display:flex; flex-direction:column; gap:12px; overflow:auto; min-height:0; }
  .ph-body > .card { min-height:110px; }
  .ph-chips { display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; flex:none; }
  .ph-chips .chip { flex:none; }
  /* The section rail sits directly on top of the app rail: which app, and
     which part of it, both within thumb reach at the bottom of the screen. */
  .ph-sub {
    flex:none; display:flex; gap:7px; overflow-x:auto; padding:9px 14px;
    border-top:1px solid var(--edge); background:rgba(5,10,17,.55);
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
            mask-image:linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
  }
  .ph-sub::-webkit-scrollbar { height:0; }

  /* ── the board as swipeable priority columns ── */
  /* One column fills the screen; swipe left or right for the next. No peeking
     neighbour — the dots in the header say how many there are instead. */
  .ph-board {
    display:flex; gap:0; overflow-x:auto; scroll-snap-type:x mandatory;
    scroll-behavior:smooth; margin:0 -16px;
  }
  .ph-board::-webkit-scrollbar { height:0; }
  .ph-col {
    flex:none; width:100%; scroll-snap-align:start; padding:0 16px;
    display:flex; flex-direction:column; gap:10px; min-width:0;
  }
  .ph-dots { margin-left:auto; display:flex; gap:5px; align-items:center; }
  .ph-dots i {
    width:5px; height:5px; border-radius:50%; background:rgba(120,200,235,.28);
  }
  .ph-dots i.on { background:var(--arc-400); box-shadow:0 0 7px var(--arc-500); }
  .ph-col-h { display:flex; align-items:center; gap:9px; padding:0 2px; }
  .ph-col-h i { width:7px; height:7px; border-radius:50%; flex:none; }
  .ph-col-h b {
    font-family:var(--mono); font-size:calc(var(--s0)*.86); font-weight:700;
    letter-spacing:.13em; text-transform:uppercase; color:var(--txt);
  }
  .ph-col-h span {
    font-family:var(--mono); font-size:calc(var(--s0)*.8); color:var(--faint);
    font-variant-numeric:tabular-nums;
  }
  .ph-col-b { display:flex; flex-direction:column; gap:10px; }
  .ph-add {
    display:flex; align-items:center; gap:9px; min-height:var(--tap);
    border:1px dashed var(--edge); border-radius:11px; background:transparent;
    color:var(--faint); padding:0 14px; font-size:calc(var(--s0)*.9);
  }
  .ph-add svg { width:15px; height:15px; }
  .ph-add:hover { border-color:var(--edge-hot); color:var(--arc-300); }
  .ph-sub .chip { flex:none; font-size:calc(var(--s0)*.76); }
  /* ── phone: cards size to their content ────────────────────────────
     A 12-column grid is a desktop idea, so the phone stacks. But a flex
     column shrinks its items by default, and a blanket min-height pinned
     every card to 120px — so a chart or a ring was compressed, and
     .body's justify-content:center then centred the overflow, which read
     as the content sitting on top of its own title. flex:none, and let
     each card be as tall as it needs. */
  .ui[data-surface="phone"] .bento { display:flex; flex-direction:column; gap:12px; min-height:0; }
  /* every card on the phone, not only those inside a .bento — the System
     sections return cards directly, and a rule scoped to .bento missed them
     entirely, which is how the same overflow came back a second time */
  .ui[data-surface="phone"] .ph-body .card { flex:none; min-height:0; }
  .ui[data-surface="phone"] .card .body { min-height:0; }
  /* components that are sized by their container on desktop need a floor here */
  .ui[data-surface="phone"] .cf { min-height:118px; }
  .ui[data-surface="phone"] .ring { max-width:116px; }
  .ui[data-surface="phone"] .body.row-split { flex-direction:column; align-items:flex-start; gap:10px; }
  .ui[data-surface="phone"] .heat i { height:20px; }

  /* ── phone calendar: dots, not chips ───────────────────────────────
     A month grid on a 390px screen gives each day ~48px of width. A task
     title truncated to "T…" tells nobody anything, so the phone shows a
     priority dot per task and lists the month's items underneath. */
  .ui[data-surface="phone"] .cal { padding:12px 10px; }
  .ui[data-surface="phone"] .cal-g { grid-auto-rows:minmax(46px, auto); gap:4px; }
  .ui[data-surface="phone"] .cal-d {
    flex-direction:row; flex-wrap:wrap; align-content:flex-start; gap:3px; padding:4px;
  }
  .ui[data-surface="phone"] .cal-n { flex-basis:100%; }
  .ui[data-surface="phone"] .cal-t {
    font-size:0; width:7px; height:7px; border-radius:50%; padding:0;
    border-left:0; background:var(--arc-500);
  }
  .ui[data-surface="phone"] .cal-t[data-pri="1"] { background:var(--crit); }
  .ui[data-surface="phone"] .cal-t[data-pri="2"] { background:var(--warn); }
  .ui[data-surface="phone"] .cal-h span { font-size:calc(var(--s0)*.66); }

  .ph-rail {
    position:relative; flex:none; border-top:1px solid var(--edge);
    background:var(--panel); backdrop-filter:blur(18px); padding:8px 0 20px;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
            mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  /* the band the centred destination sits in */
  .ph-band {
    position:absolute; left:50%; top:6px; bottom:16px; width:88px; translate:-50% 0;
    border-left:1px solid rgba(120,200,235,.2); border-right:1px solid rgba(120,200,235,.2);
    background:linear-gradient(180deg, rgba(56,214,255,.12), rgba(56,214,255,.02));
    pointer-events:none; z-index:0; border-radius:10px;
  }
  .ph-band i {
    position:absolute; width:8px; height:8px; border:1.5px solid var(--arc-400);
    opacity:.85; filter:drop-shadow(0 0 4px var(--glow));
  }
  .ph-band i:nth-child(1){top:-1px;left:-1px;border-right:0;border-bottom:0}
  .ph-band i:nth-child(2){top:-1px;right:-1px;border-left:0;border-bottom:0}
  .ph-band i:nth-child(3){bottom:-1px;left:-1px;border-right:0;border-top:0}
  .ph-band i:nth-child(4){bottom:-1px;right:-1px;border-left:0;border-top:0}

  .ph-track {
    position:relative; z-index:1; display:flex; overflow-x:auto;
    scroll-snap-type:x mandatory; scroll-behavior:smooth;
  }
  .ph-track::-webkit-scrollbar { height:0; }
  .ph-tab {
    flex:none; width:88px; scroll-snap-align:center;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    border:0; background:transparent; padding:6px 0; min-height:var(--tap);
    opacity:.45; transition:opacity .25s ease;
  }
  .ph-tab svg { width:22px; height:22px; }
  .ph-tab span {
    font-family:var(--mono); font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--faint);
  }
  .ph-tab.on { opacity:1; }
  .ph-tab.on svg { color:var(--arc-400); filter:drop-shadow(0 0 8px var(--glow)); }
  .ph-tab.on span { color:var(--arc-300); font-weight:700; }

  .drawer { position:absolute; inset:0; z-index:50; display:flex; }
  .drawer .pn { width:76%; overflow:visible; background:var(--panel-solid); backdrop-filter:blur(22px); border-right:1px solid var(--edge-hot); padding:16px 12px; display:flex; flex-direction:column; gap:2px; }
  .drawer .rest { flex:1; background:rgba(2,5,10,.6); border:0; }
}
</style>

<body>

<div class="bar">

  <div class="grp">
    <label>Surface</label>
    <div class="seg" id="segSurface">
      <button data-v="desktop">Desktop</button>
      <button data-v="wall">Wall 24&quot;</button>
      <button data-v="phone">Phone</button>
      <button data-v="kiosk">Kiosk 10&quot;</button>
      <button data-v="remote">Kiosk &rarr; Wall</button>
    </div>
  </div>

  <div class="grp">

<script>
/* ══════════════════════════════════════════════════════════════

const S = {

/* The house's labels. One list: the New-task picker and the Labels page both

`;
const scopeLabel = () =>
  S.scope === 'all' ? 'Everyone' : S.scope === 'wall' ? 'the Wall' : me().name;

let TASKS = [
  { id:1, title:'Take the bins out',       pri:1, due:'2 days late', late:true,  who:'N', done:false, mine:true,
    labels:['Weekly','Outside'], repeat:'Every Mon', esc:2 },
  { id:2, title:'Change the water filter', pri:2, due:'Tomorrow',    late:false, who:'P', done:false, mine:false,
    labels:['Kitchen'], repeat:'Every 6 months', esc:0 },
  { id:3, title:'Descale the kettle',      pri:2, due:'Wed',         late:false, who:'N', done:false, mine:true,
    labels:['Kitchen'], repeat:'Every 8 weeks', esc:0 },
  { id:4, title:'Book the boiler service', pri:3, due:'Sat 16',      late:false, who:'P', done:false, mine:false,
    labels:['Annual','Safety'], repeat:'Every year', esc:0, approver:'N' },
  { id:5, title:'Clean the gutters',       pri:3, due:'Sep 2',       late:false, who:'N', done:false, mine:true,
    labels:['Outside'], repeat:'Every autumn', esc:0, archived:true },
];

const ALERTS = [
  { t:'Pi temperature above 70°C',      s:'warn', at:'14:10' },
  { t:'Take the bins out is overdue',   s:'crit', at:'09:00' },
  { t:'Weather integration recovered',  s:'ok',   at:'07:42' },
];

/* ── SIZE SYSTEM ──────────────────────────────────────────────
   Every widget declares which sizes it supports, and each size is
   a DESIGNED state rather than the same content stretched. Sizes
   are whole cells on a 12-col grid with a fixed row height, so any
   arrangement tiles without ragged gaps.                        */
const SIZES = { S:{c:3,r:1}, M:{c:6,r:1}, L:{c:6,r:2}, XL:{c:12,r:1} };

/* The real widget catalogue, read out of the running app:

     .venv/bin/python manage.py shell -c "from nora_home.core.registry import
       registered_apps; ..."

   Ten widgets across three apps. Two that earlier revisions showed — Outside
   and Alerts — are not widgets at all: weather is an integration feeding the
   scene, and alerts are a page. They have been removed rather than left in
   looking real. Sizes are this redesign's proposal; the widgets are not. */
const LIB = {
  due_next:   { name:'Due next',            src:'Todo',         sizes:['M','L','XL'] },
  open_now:   { name:'Open now',            src:'Todo',         sizes:['S','M','L']  },
  streak:     { name:'Keeping at it',       src:'Todo',         sizes:['S','M']      },
  throughput: { name:'You typically finish',src:'Todo',         sizes:['S','M']      },
  year:       { name:'The year so far',     src:'Todo',         sizes:['XL','L']     },
  flow:       { name:'Arriving vs finishing',src:'Todo',        sizes:['L','XL']     },
  health:     { name:'House health',        src:'Home',         sizes:['S','M']      },
  pitemp:     { name:'Pi temperature',      src:'Home',         sizes:['S','M','L','XL'] },
  disk:       { name:'Disk',                src:'Home',         sizes:['S','M']      },
  vitals:     { name:'House vitals',        src:'Measurements', sizes:['M','L']      },
};

/* Packs to whole rows: 6+3+3 | 6(cont)+6 | 3+3+6 | 12 */
let BOARD = [
  { k:'due_next', size:'L' }, { k:'open_now', size:'S' }, { k:'health', size:'S' },
  { k:'pitemp', size:'M' },
  { k:'disk', size:'S' }, { k:'streak', size:'S' }, { k:'vitals', size:'M' },
  { k:'year', size:'XL' },
];

const SURF = {
  desktop:{ w:1440, h:900,  label:'Desktop',      tags:['Work layout'] },
  wall:   { w:1920, h:1080, label:'Wall · 24&quot;', tags:['Work layout, one ramp up'] },
  phone:  { w:390,  h:844,  label:'Phone',        tags:['Work layout','bottom tabs'] },
  kiosk:  { w:1024, h:600,  label:'Kiosk · 10.1&quot;', tags:['Controller','60px targets'] },
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const live = () => TASKS.filter(t => !t.archived);
const openN = () => live().filter(t => !t.done).length;
const lateN = () => live().filter(t => !t.done && t.late).length;

function toast(m){ S.toast=m; render(); clearTimeout(toast._t); toast._t=setTimeout(()=>{S.toast=null;render();},1900); }

const I = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  task:'<path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4"/>',
  bell:'<path d="M18 8A6 6 0 106 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/>',
  chart:'<path d="M3 17l5-6 4 4 5-8 4 5"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  log:'<path d="M4 5h16M4 12h16M4 19h10"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
  wrench:'<path d="M14 7l3 3M3 21l3-1 11-11-2-2L4 18z"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  screen:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
};
const svg=(d,c='')=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

/* the arc-reactor mark — concentric rings, the one ornament in the system */
const MARK = `<svg width="22" height="22" viewBox="0 0 40 40" aria-hidden="true">
  <circle cx="20" cy="20" r="18" fill="none" stroke="#38d6ff" stroke-width="1.4" opacity=".45"/>
  <circle cx="20" cy="20" r="12.5" fill="none" stroke="#7fe9ff" stroke-width="1.2" opacity=".7"
          stroke-dasharray="4 3"/>
  <circle cx="20" cy="20" r="7" fill="none" stroke="#a5eeff" stroke-width="1.6"/>
  <circle cx="20" cy="20" r="3.4" fill="#e8fbff"/>
</svg>`;

/* ── scene ──────────────────────────────────────────────────── */
function scene() {
  const stars = Array.from({length:22},()=>`<i style="left:${(Math.random()*96+2).toFixed(1)}%;
    top:${(Math.random()*48+2).toFixed(1)}%;opacity:${(Math.random()*.5+.45).toFixed(2)}"></i>`).join('');

  let wx='';
  if (['cloud','rain','snow'].includes(S.weather))
    wx += Array.from({length:5},(_,i)=>`<span class="cloud" style="left:${i*22-12}%;top:${5+i*8}%;
      width:${26+i*6}%;height:${6+i*1.4}%;animation-delay:-${i*13}s"></span>`).join('');
  if (S.weather==='rain')
    wx += Array.from({length:60},()=>`<span class="drop" style="left:${(Math.random()*100).toFixed(1)}%;
      animation-delay:-${(Math.random()).toFixed(2)}s;animation-duration:${(.55+Math.random()*.35).toFixed(2)}s"></span>`).join('');
  if (S.weather==='snow')
    wx += Array.from({length:44},()=>`<span class="flake" style="left:${(Math.random()*100).toFixed(1)}%;
      animation-delay:-${(Math.random()*7).toFixed(2)}s;animation-duration:${(5+Math.random()*4).toFixed(2)}s"></span>`).join('');

  return `<div class="scene" aria-hidden="true">
    <div class="sky"></div><div class="stars">${stars}</div><div class="orb"></div>
    <div class="wx">${wx}</div><div class="grid-o"></div><div class="scan"></div>
  </div>`;
}

/* ── component helpers ──────────────────────────────────────── */
const readout=(v,u,cap,mod='')=>`<div class="read ${mod}"><b>${esc(v)}</b>${u?`<span>${esc(u)}</span>`:''}</div>
  ${cap?`<div class="cap">${esc(cap)}</div>`:''}`;

const ck=t=>`<button class="ck ${t.done?'on':''} ${t.late&&!t.done?'late':''}" data-act="toggle" data-id="${t.id}"
  aria-pressed="${t.done}" aria-label="${t.done?'Mark not done':'Mark done'}: ${esc(t.title)}">
  ${svg('<path d="M4 12l5 5L20 6"/>')}</button>`;

const trow=t=>`<div class="row ${t.done?'done':''}">${ck(t)}<span class="t">${esc(t.title)}</span>
  <span class="d ${t.late&&!t.done?'late':''}">${esc(t.done?'done':t.due)}</span></div>`;

const spark=(h=54)=>`<svg viewBox="0 0 400 ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block" aria-hidden="true">
  <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#38d6ff" stop-opacity=".42"/><stop offset="1" stop-color="#38d6ff" stop-opacity="0"/>
  </linearGradient></defs>
  <path d="M0 ${h*.72} L36 ${h*.6} L72 ${h*.68} L108 ${h*.45} L144 ${h*.53} L180 ${h*.3} L216 ${h*.42}
           L252 ${h*.22} L288 ${h*.38} L324 ${h*.26} L360 ${h*.44} L400 ${h*.34} L400 ${h} L0 ${h}Z" fill="url(#sg)"/>
  <path d="M0 ${h*.72} L36 ${h*.6} L72 ${h*.68} L108 ${h*.45} L144 ${h*.53} L180 ${h*.3} L216 ${h*.42}
           L252 ${h*.22} L288 ${h*.38} L324 ${h*.26} L360 ${h*.44} L400 ${h*.34}"
        fill="none" stroke="#7fe9ff" stroke-width="1.8"/>
  <circle cx="400" cy="${h*.34}" r="3.4" fill="#e8fbff"/></svg>`;

/* A concentric ring gauge. The house mark is a ring; this is the same idea
   carrying a number, which is what keeps the identity from being decoration. */
const ring = (pct, big, small, colour='var(--arc-400)') => {
  const R=42, C=2*Math.PI*R;
  return `<div class="ring"><svg viewBox="0 0 110 110" aria-hidden="true">
    <circle cx="55" cy="55" r="${R}" fill="none" stroke="rgba(120,200,235,.14)" stroke-width="7"/>
    <circle cx="55" cy="55" r="${R}" fill="none" stroke="${colour}" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"
      transform="rotate(-90 55 55)" style="filter:drop-shadow(0 0 6px ${colour})"/>
    <circle cx="55" cy="55" r="30" fill="none" stroke="rgba(120,200,235,.2)"
      stroke-width="1" stroke-dasharray="3 4"/>
  </svg><div class="ring-c"><b>${esc(big)}</b><span>${esc(small)}</span></div></div>`;
};

const heat=(n=96)=>`<div style="display:flex;gap:2px;align-items:flex-end">`+
  Array.from({length:n},()=>{const v=Math.random();
    return `<i style="flex:1;height:${(10+v*22).toFixed(0)}px;border-radius:1px;
      background:${v<.28?'rgba(120,200,235,.12)':`rgba(56,214,255,${(.2+v*.7).toFixed(2)})`}"></i>`;}).join('')+`</div>`;

/* ── widgets: one function, four designed sizes ─────────────── */
function widget(item, i) {
  const { k, size } = item, meta = LIB[k], sz = SIZES[size];

  const tools = S.editing
    ? `<span class="tools">${meta.sizes.map(s=>`<button class="szbtn" data-act="size" data-i="${i}" data-v="${s}"
         aria-pressed="${s===size}">${s}</button>`).join('')}</span>`
    : `<span class="src">${size}</span>`;

  let body = '';
  switch (k) {
    case 'due_next': {
      const l = live().filter(t=>!t.done);
      if (size==='M') body = readout(l.length,'due', l[0]?`next: ${l[0].title}`:'nothing due');
      else body = `<div class="body top">${l.length?l.slice(0,size==='XL'?6:4).map(trow).join('')
        :'<div class="empty"><b>All clear</b><span>Nothing is due.</span></div>'}</div>`;
      break;
    }
    case 'open_now':
      if (size==='S') body = readout(openN(),'open', lateN()?`${lateN()} overdue`:'none late', lateN()?'crit':'');
      else if (size==='M') body = readout(openN(),'open',`${lateN()} overdue · 2 this week`)+spark(34);
      else body = readout(openN(),'open',`${lateN()} overdue`)+`<div class="rule"></div>`+
        `<div class="body top">${live().filter(t=>!t.done).slice(0,3).map(trow).join('')}</div>`;
      break;
    case 'streak':
      body = size==='S' ? readout('1','of 30','days with something done')
        : `<div class="body row-split">${ring(3,'1','of 30')}
             <div><div class="cap">Days with something finished.</div>
             <div class="cap">Best run this year: 9.</div></div></div>`;
      break;
    case 'throughput':
      body = size==='S' ? readout('0.0','a day','median')
        : readout('0.0','a day','median over the last 30 days')+spark(34);
      break;
    case 'year':
      body = `<div class="body">${heat(size==='XL'?110:56)}</div>
              <div class="cap">148 days with something finished</div>`;
      break;
    case 'flow': {
      const bars=[4,7,3,9,6,11,5,8,12,6,9,4].map((v,i)=>
        `<div class="cf-col"><i style="height:${v*(size==='XL'?5:7)}px"></i>
         <i class="b" style="height:${v*0.7*(size==='XL'?5:7)}px"></i>
         <span>${['A','S','O','N','D','J','F','M','A','M','J','J'][i]}</span></div>`).join('');
      body = `<div class="body"><div class="cf">${bars}</div>
        <div class="cf-key"><span><i style="background:var(--arc-400)"></i>arrived</span>
        <span><i style="background:var(--ok)"></i>finished</span></div></div>`;
      break;
    }
    case 'health':
      body = size==='S'
        ? `<div class="body">${ring(100,'OK','10/10','var(--ok)')}</div>`
        : `<div class="body row-split">${ring(100,'OK','10/10','var(--ok)')}
             <div><div class="cap">All ten services up.</div>
             <div class="cap">Checked 4 minutes ago.</div></div></div>`;
      break;
    case 'pitemp':
      if (size==='S') body = readout('52','°C','peak 61°');
      else if (size==='M') body = readout('52','°C','')+spark(38);
      else body = readout('52','°C','24 hours · peak 61° at 14:10')+spark(size==='XL'?54:78);
      break;
    case 'disk':
      body = size==='S' ? readout('18','%','90.7 GB free')
        : readout('18','%','90.7 GB of 110 GB free')+spark(30);
      break;
    case 'vitals': {
      const rows=[['Outside temperature','24.8 °C','house'],
                  ['CPU temperature','52 °C','pi'],
                  ['Disk used','18 %','pi'],
                  ['Humidity','61 %','house']];
      body = `<div class="body top">${rows.slice(0,size==='L'?4:2).map(([n,v,src])=>
        `<div class="row"><span class="t">${n}</span>
         <span class="d" style="margin-left:auto">${v}</span>
         <span class="d">${src}</span></div>`).join('')}</div>`;
      break;
    }
  }

  return `<div class="card panel" style="--c:${sz.c};--r:${sz.r}">
    <div class="card-h"><h4>${esc(meta.name)}</h4>${tools}</div>${body}</div>`;
}

/* ── work layout ────────────────────────────────────────────── */
const IN_APP = () => S.page === 'tasks';

/* The Pi's vitals, in the rail. Lives beside its only consumer: it has twice
   been deleted by an unrelated range edit while sitting among the kiosk data.
   Only temperature and disk are collected today — see Story 52. */
const VITALS = [
  { k:'CPU',  v:'34%',      bar:34 },
  { k:'MEM',  v:'62%',      bar:62 },
  { k:'TEMP', v:'52°',      bar:61, warm:true },
  { k:'FAN',  v:'2.4k',     bar:30 },
  { k:'LOAD', v:'0.42' },
  { k:'UP',   v:'4d 06:12' },
];

function rail() {
  // Every destination is the same module: bracketed icon cell, mono label,
  // optional live count. Nothing in the rail is bare text.
  const item = (p, ic, l, n, calm) => `<button class="nav" ${p?`data-act="page" data-v="${p}"`:''}
    ${S.page===p?'aria-current="page"':''}>
    <span class="ib">${svg(ic)}</span>${esc(l)}
    ${n?`<span class="n ${calm?'calm':''}">${n}</span>`:''}</button>`;

  const tp = (v, ic, l) => `<button class="nav" data-act="todopage" data-v="${v}"
    ${S.todoPage===v?'aria-current="page"':''}><span class="ib">${svg(ic)}</span>${l}</button>`;

  /* Both branches are read off REGISTRY. Nothing here names an app. */
  const app = currentApp();
  const inner = !app.base ? `
    <div class="grp-lab">${esc(app.title)}</div>
    ${app.sections.map(sec=>`<button class="nav" data-act="todopage" data-v="${sec.v}"
      ${S.todoPage===sec.v?'aria-current="page"':''}>
      <span class="ib">${svg(sec.icon)}</span>${esc(sec.title)}</button>`).join('')}
    <div class="grp-lab">Home</div>
    ${item('home',I.home,'Back to house')}` : `
    <div class="grp-lab">${esc(BASE_APP.title)}</div>
    ${BASE_APP.sections.map(sec=>item(sec.v, sec.icon, sec.title, sec.badge)).join('')}
    <div class="grp-lab">Apps</div>
    ${HOUSE_APPS.map(a2=>item(a2.page, a2.icon, a2.title, badgeOf(a2), true)).join('')}`;

  return `<nav class="rail" aria-label="Navigation">
    <div class="brand">${MARK}<b>Nora Home</b></div>${inner}
    <div class="rail-foot">
      <div class="vitals panel">
        ${VITALS.map(v => v.bar === undefined
          ? `<div class="vit"><span class="vk">${v.k}</span><span class="vv">${v.v}</span></div>`
          : `<div class="vit"><span class="vk">${v.k}</span>
               <span class="vbar ${v.warm?'warm':''}"><i style="width:${v.bar}%"></i></span>
               <span class="vv">${v.v}</span></div>`).join('')}
      </div>
      ${memberChip()}
    </div></nav>`;
}

function appbar() {
  const T={home:'Home',tasks:'Todo',alerts:'Alerts',numbers:'Measurements',
    settings:'Settings',system:'System'};
  let a='';
  if (S.page==='home') {
    a = S.editing
      ? `<button class="btn" data-act="shuffle">Shuffle</button>
         <button class="btn pri" data-act="edit">Done</button>`
      : `<button class="btn ghost" data-act="palette">Search <kbd>&#8984;K</kbd></button>
         <button class="btn" data-act="edit">Rearrange</button>
         <button class="btn pri" data-act="sheet" data-v="widget">Add a widget</button>`;
  } else if (S.page==='tasks') {
    if (S.todoPage==='reporting') { a=`<button class="btn ghost" data-act="toast" data-v="Range: last 12 months">Last 12 months</button>
      <button class="btn" data-act="toast" data-v="Exported reporting.csv">Export</button>`; }
    else {
      const c=(v,l)=>`<button class="chip" data-act="filter" data-v="${v}" aria-pressed="${S.filter===v}">${l}</button>`;
      const verbs=(REGISTRY.find(r=>r.slug==='todo').actions||[])
        .filter(x=>x.v!=='new-task')

function taskCard(t) {
  const esc_ = t.esc ? `<span class="t-esc" title="Escalated to level ${t.esc}">
      ${svg('<path d="M12 3l8 14H4z"/><path d="M12 9v4"/>')}L${t.esc}</span>` : '';
