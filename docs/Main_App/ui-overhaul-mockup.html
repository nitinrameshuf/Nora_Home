  const appr = t.approver ? `<span class="t-appr">needs sign-off</span>` : '';
  return `<div class="task ${t.done?'done':''}" data-pri="${t.pri}">
    <div class="tt">${esc(t.title)}</div>
    <div class="t-meta">
      <span class="due ${t.late&&!t.done?'late':''}">${esc(t.done?'done':t.due)}</span>

function boardView() {
  /* "Mine" follows whoever is signed in; in Everyone or Wall scope the board
     is the whole household's, which is what those scopes mean. */
  const mineNow = t => S.scope !== 'self' ? true : t.who === me().initial;
  const vis=t=>{ if(S.filter==='archived') return !!t.archived; if(t.archived) return false;
    if(S.filter==='mine') return mineNow(t); if(S.filter==='today') return t.late||t.due==='Tomorrow'; return true; };
  const sh=TASKS.filter(vis);
  const col=(p,l,c)=>{const it=sh.filter(t=>t.pri===p);
    return `<div class="col"><div class="col-h"><i style="background:${c};box-shadow:0 0 10px ${c}"></i>
      <b>${l}</b><span class="n">${it.length}</span></div>
      ${it.map(taskCard).join('')||`<div class="empty"><b>Clear</b><span>Nothing at this priority.</span></div>`}
    </div>`;};

  const stat=(v,l,mod='')=>`<div class="bstat ${mod}"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="bstats">
      ${stat(openN(),'open')}${stat(lateN(),'overdue', lateN()?'crit':'')}
      ${stat(live().filter(t=>t.esc).length,'escalating', live().filter(t=>t.esc).length?'warn':'')}
      ${stat(live().filter(t=>t.done).length,'done today','ok')}
      ${stat(TASKS.filter(t=>t.archived).length,'archived')}
    </div>
    <div class="board">${col(1,'Priority 1','#ff4d5e')}${col(2,'Priority 2','#ffb648')}${col(3,'Priority 3','#38d6ff')}</div>`;
}

    const d=i-4; const inMonth=d>=1&&d<=31; const today=d===8;

      <span class="cal-n">${inMonth?d:''}</span>${marks}</div>`;}).join('');

/* ── phone ──────────────────────────────────────────────────── */
function renderPhone() {
  const T={home:'Home',tasks:'Todo',alerts:'Alerts',system:'System',settings:'Settings'};

  let body;
  /* The section rail is the current app's own sections — read from REGISTRY,
     so an app that declares sections gets this on the phone automatically. */
  const app = currentApp();
  const cur = app.base ? S.page : S.todoPage;
  const subRail = app.sections.length > 1
    ? `<div class="ph-sub">${app.sections.map(sec=>
        `<button class="chip" data-act="${app.base?'page':'todopage'}" data-v="${sec.v}"
          aria-pressed="${cur===sec.v}">${esc(sec.title)}</button>`).join('')}</div>`
    : '';
  if (S.page==='home') {
    body = widget({k:'due_next',size:'L'},800)
      + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
         ${widget({k:'open_now',size:'S'},801)}${widget({k:'health',size:'S'},802)}</div>`
      + widget({k:'vitals',size:'M'},803);

  } else if (S.page==='tasks') {
    /* Second level. Without this the phone could reach Todo and then nothing
       inside it — all seven sections were unreachable, which is the dead end
       CLAUDE.md forbids. The bottom rail chooses the app; this chooses the
       section, exactly as the desktop rail does. */

    let inner;
    if (S.todoPage==='board') {
      /* The board keeps its priority columns on the phone — one per screen,
         flicked between, with the neighbours peeking at the edges so it is
         obvious there is more. Same snap mechanic as the app rail; a phone
         cannot show three columns side by side but it can show them in turn. */
      const vis=t=>S.filter==='mine'?t.mine:S.filter==='today'?(t.late||t.due==='Tomorrow'):true;
      const col=(pri,label,colour)=>{
        const items=live().filter(t=>t.pri===pri&&vis(t));
        const dots=[1,2,3].map(n=>`<i class="${n===pri?'on':''}"></i>`).join('');
        return `<section class="ph-col">
          <div class="ph-col-h"><i style="background:${colour};box-shadow:0 0 10px ${colour}"></i>
            <b>${label}</b><span>${items.length}</span>
            <span class="ph-dots" aria-hidden="true">${dots}</span></div>
          <div class="ph-col-b">
            ${items.map(taskCard).join('')||`<div class="empty"><b>Clear</b><span>Nothing at this priority.</span></div>`}
            <button class="ph-add" data-act="sheet" data-v="task">
              ${svg('<path d="M12 5v14M5 12h14"/>')}Add task</button>
          </div></section>`;
      };
      inner = `<div class="ph-chips">
        ${['all','mine','today'].map(v=>`<button class="chip" data-act="filter" data-v="${v}"
          aria-pressed="${S.filter===v}">${v==='all'?'All':v==='mine'?'Mine':'Today'}</button>`).join('')}</div>
        <div class="ph-board">${col(1,'Priority 1','#ff4d5e')}${col(2,'Priority 2','#ffb648')}${col(3,'Priority 3','#38d6ff')}</div>`;
    } else {
      inner = (TODO_VIEWS[S.todoPage] || boardView)();
    }
    body = inner;

  } else if (S.page==='alerts') {
    body = `<div class="card panel"><div class="card-h"><h4>Today</h4></div><div class="body top">
      ${ALERTS.map(a=>`<div class="row"><span class="badge ${a.s}">${a.s}</span>
        <span class="t">${esc(a.t)}</span><span class="d">${a.at}</span></div>`).join('')}</div></div>`;

  } else if (S.page==='system') {
    // the same four sections the desktop has, switched by chips rather than a rail
    subRail = `<div class="ph-sub">${SYS_SECTIONS.map(([v,l])=>
      `<button class="chip" data-act="syspage" data-v="${v}" aria-pressed="${S.sysPage===v}">${l}</button>`).join('')}</div>`;
    body = (SYS_VIEWS[S.sysPage]||sysHealth)();

  } else body = PAGES[S.page]();

  /* Every destination lives on one horizontally scrolling rail with a fixed
     centre band — the same picker as the kiosk, turned on its side. Whatever
     settles in the band opens. A fixed row of tabs tops out around five; this
     takes as many apps as the house grows. */
  /* One entry per registry app — the same list the sidebar and kiosk use. */
  const here = currentApp();
  const tab=a2=>{ const v = a2.base ? 'home' : a2.page; const on = a2.slug===here.slug;
    return `<button class="ph-tab ${on?'on':''}" data-act="page" data-v="${v}"
      ${on?'aria-current="page"':''}>${svg(a2.icon)}<span>${esc(a2.title)}</span></button>`; };

  /* The drawer mirrors the desktop rail: Home's own pages, then the apps. Tabs
     already reach Home, Todo and Alerts, so the drawer does not repeat them
     for navigation's sake — it is the same list, one level up. */
  const dr = S.drawer ? `<div class="drawer"><div class="pn">
    <div class="brand">${MARK}<b>Nora Home</b></div>
    <div class="grp-lab">Home</div>

/* ══════════════════════════════════════════════════════════════
   KIOSK — a control surface for the 24". Buttons and dials only.

   GROUNDED IN THE REAL CONTRACT, not invented. The wall protocol
   (static/nora_home/js/wall-live.js) implements exactly three
   actions: `navigate`, `refresh`, `banner`. The kiosk adds
   `show-menu` and `switch-app`. So every control below is a PATH
   THE WALL NAVIGATES TO — that is the whole vocabulary today.

   Extensibility is free and is the point: an app declares
   `nora_kiosk_controls = [{"title": ..., "path": ...}]` on its
   NoraAppConfig and its tile plus its own control screen appear
   with no change to the platform. Todo's five below are copied
   verbatim from nora_home/todo/apps.py.

   Anything marked NEW does not exist yet and is new platform work.
   ══════════════════════════════════════════════════════════════ */
/* Exactly what the kiosk reaches today — read out of the running app, not
   invented. nora_home/displays/views.py builds this from navigation(role)
   plus three house_links, with a Home tile in front:

     .venv/bin/python manage.py shell -c "from nora_home.core.registry
       import navigation; ..."   ->  Alerts, Measurements, Integrations, Todo

   Only Todo declares nora_kiosk_controls (5 of them, copied verbatim from
   nora_home/todo/apps.py). Everything else is a plain navigate, which is why
   those banks hold a single key. Nothing here is a placeholder or an example;
   when a family app is installed it appears by declaring itself, and the
   encoder simply gains a tick. */
/* The kiosk mirrors the sidebar exactly: the left scroller is Home plus
   whatever sits under Apps, and the key bank is the selected app's own
   sections — the same list the desktop rail shows once you are inside it.

   NOTE FOR THE BUILD: today the platform declares these twice —
   `nora_sections` for the sidebar and `nora_kiosk_controls` for the kiosk,
   deliberately fewer ("five big touch targets"). Mirroring them means an app
   declares its sections ONCE and both surfaces follow. That is a real
   simplification to the app contract, and it is a decision, not an oversight:
   see the Phase 8 stories. */
/* ══════════════════════════════════════════════════════════════
   THE REGISTRY — one declaration, every surface.

   This is the mockup's stand-in for nora_home.core.registry. Installing an
   app means adding ONE entry here; it then appears, with no further edits, in:

     · the desktop sidebar, under Apps
     · the phone's bottom rail
     · the phone's section rail, once you are inside it
     · the kiosk's left scroller
     · the kiosk's key bank, as that app's sections

   The real platform already works this way — navigation(role) walks
   registered_apps(), and both templates/base.html and displays/views.py
   consume it. Earlier revisions of this file kept three separate hardcoded
   lists, which is exactly the drift this structure exists to prevent.

   `base: true` marks the one app that is the house itself. Everything else is
   an app built on top; nothing in the UI distinguishes them beyond that.
   ══════════════════════════════════════════════════════════════ */
const REGISTRY = [
  { slug:'home', title:'Home', icon:I.home, base:true, path:'/home/',
    actions:[
      { v:'rearrange',  title:'Rearrange',   kiosk:true },
      { v:'add-widget', title:'Add a widget', kiosk:false },
    ],
    sections:[
      { v:'home',     title:'Dashboard', path:'/home/',          icon:I.home },
      { v:'alerts',   title:'Alerts',    path:'/home/alerts/',   icon:I.bell, badge:2 },
      { v:'system',   title:'System',    path:'/home/system/',   icon:I.gear },
      { v:'settings', title:'Settings',  path:'/home/settings/', icon:I.screen },
    ] },

  { slug:'todo', title:'Todo', icon:I.task, page:'tasks', path:'/todo/',
    badge:()=>openN(),
    /* Declared once. Each surface renders the ones it can support: desktop and
       phone get buttons, the kiosk gets keys, the wall gets none because it is
       read-only. `kiosk:false` marks a verb that needs typing or a choice and
       therefore cannot live on a key. */
    actions:[
      { v:'complete-next', title:'Done: next due', kiosk:true },
      { v:'snooze-next',   title:'Snooze 1 hour',  kiosk:true },
      { v:'new-task',      title:'New task',       kiosk:false },
    ],
    sections:[
      { v:'board',     title:'Board',     path:'/todo/',            icon:I.task },
      { v:'calendar',  title:'Calendar',  path:'/todo/calendar/',   icon:I.log },
      { v:'search',    title:'Search',    path:'/todo/search/',     icon:I.grid },
      { v:'labels',    title:'Labels',    path:'/todo/labels/',     icon:I.grid },
      { v:'reporting', title:'Reporting', path:'/todo/reporting/',  icon:I.chart },
      { v:'system',    title:'System',    path:'/todo/system/',     icon:I.bell },
      { v:'settings',  title:'Settings',  path:'/todo/settings/',   icon:I.gear },

];

/* Derived live, never snapshotted. As plain consts these were evaluated once
   at load, so installing an app updated only the surface that happened to read
   REGISTRY directly — the other two kept serving a stale copy. That is the
   exact drift this registry exists to prevent, so the derivations are getters. */
Object.defineProperties(window, {
  BASE_APP:   { get: () => REGISTRY.find(a => a.base) },
  HOUSE_APPS: { get: () => REGISTRY.filter(a => !a.base) },
  WALL_APPS:  { get: () => REGISTRY.map(a => ({
                  slug:a.slug, title:a.title, icon:a.icon, path:a.path,

});
const badgeOf = a => typeof a.badge === 'function' ? a.badge() : a.badge;

  return `<div class="frame"><div class="frame-cap"><b>${m.label}</b><em>${m.w} &times; ${m.h}</em>

function render() {
  const st=document.getElementById('stage');
  if (S.surface==='remote') {
    // Render the wall at whatever the kiosk has pointed it to, then put S.page

    // on, and switching back to Desktop lands somewhere you never chose.
    const keep = S.page;
    S.page = S.wallPage;
    const wallFrame = frame('wall', ui('wall', renderWork()), '<em>follows the kiosk</em>');
    S.page = keep;
    st.innerHTML=`<div class="pair">
      ${frame('kiosk', ui('kiosk',renderKiosk(), ''), '<em>turn the encoder &rarr;</em>')}
      ${wallFrame}
    </div>`;
  } else if (S.surface==='kiosk') {
    st.innerHTML=frame('kiosk', ui('kiosk',renderKiosk(), ''));
  } else if (S.surface==='phone') {
    st.innerHTML=frame('phone', ui('phone',renderPhone(), sheet()));
  } else {
    st.innerHTML=frame(S.surface, ui(S.surface, renderWork(), sheet()+palette()));
  }

  const seg=(id,v)=>document.querySelectorAll(`#${id} button`).forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.v===v)));

  seg('segWeather',S.weather);

function fit() {
  document.querySelectorAll('.screen').forEach(sc=>{
    const w=+sc.dataset.w, h=+sc.dataset.h;
    const k=Math.min(1, (sc.parentElement.clientWidth||w)/w);
    sc.style.width=(w*k)+'px'; sc.style.height=(h*k)+'px';
    sc.querySelector('.render').style.transform=`scale(${k})`;
  });
}
window.addEventListener('resize', fit);

/* The phone's rail is the same picker on the other axis: pad so the first and
   last destinations can reach the middle, then glide the live one into it.
   Padding is set here rather than in CSS because percentage padding resolves
   against width even when you want height — and here we need it symmetric and
   measured either way. */
function centrePhoneRail() {
  const track = document.querySelector('.ph-track');
  if (!track || !track.clientWidth) return;
  const items = track.querySelectorAll('.ph-tab');
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  const padL = Math.max(0, (track.clientWidth - first.offsetWidth) / 2);
  const padR = Math.max(0, (track.clientWidth - last.offsetWidth) / 2);
  if (Math.abs(parseFloat(track.style.paddingLeft || 0) - padL) > 0.5) {
    track.style.paddingLeft = padL + 'px';
    track.style.paddingRight = padR + 'px';
  }
  const on = track.querySelector('.ph-tab.on');
  if (!on) return;
  _auto = true;
  clearTimeout(_autoT);
  _autoT = setTimeout(() => { _auto = false; }, _calm ? 60 : 520);
  track.scrollTo({ left: on.offsetLeft - (track.clientWidth / 2) + (on.offsetWidth / 2),
                   behavior: _calm ? 'auto' : 'smooth' });
}

/* ── the app picker selects by scrolling ──────────────────────────────
   Whatever settles in the band becomes live. Debounced, so flicking past
   three apps does not send the wall to each of them in turn. `scroll` does
   not bubble, so this listens in the capture phase. */
document.addEventListener('scroll', e => {
  const t = e.target;
  if (!t || !t.closest || _auto) return;
  const vertical = t.closest('.vsel-list');
  const horizontal = t.closest('.ph-track');
  const list = vertical || horizontal;
  if (!list) return;

  clearTimeout(_snapT);
  _snapT = setTimeout(() => {
    const band = list.parentElement.querySelector(vertical ? '.vsel-band' : '.ph-band');
    if (!band) return;
    const r = band.getBoundingClientRect();
    const centre = vertical ? r.top + r.height / 2 : r.left + r.width / 2;
    let best = null, bestD = Infinity;
    list.querySelectorAll(vertical ? '.vsel-i' : '.ph-tab').forEach(el => {
      const b = el.getBoundingClientRect();
      const mid = vertical ? b.top + b.height / 2 : b.left + b.width / 2;
      const d = Math.abs(mid - centre);
      if (d < bestD) { bestD = d; best = el; }
    });
    const slug = best && best.dataset.v;
    if (!slug) return;
    if (vertical && slug !== S.wallPage) { S.wallPage = slug; toast(`Wall showing ${slug}`); }
    if (horizontal && slug !== S.page) { S.page = slug; render(); }
  }, 200);
}, true);

/* ── the bend wheel also takes a flick or a scroll gesture ── */
document.addEventListener('wheel', e => {
  const track = e.target.closest('[data-bend]');
  if (!track) return;
  e.preventDefault();
  BEND.el = track.querySelector('[data-wheel]');
  BEND.box = track.getBoundingClientRect();
  track.classList.add('held');
  bendTo(BEND.rate * BEND.max + e.deltaY * 0.55);
  clearTimeout(BEND.settle);
  BEND.settle = setTimeout(bendRelease, 190);
}, { passive: false });

/* ── the bend wheel ───────────────────────────────────────────────────
   Deliberately outside render(): the wheel is manipulated directly rather
   than re-rendered, so a state change mid-drag cannot swap the node out from
   under the pointer — the failure the label scramble hit earlier. Deflection
   is a *rate*: the further you push, the faster the wall scrolls, and letting
   go springs it back to centre. */
const BEND = { max: 74, el: null, box: null, rate: 0, timer: null };

function bendTo(px) {
  const clamped = Math.max(-BEND.max, Math.min(BEND.max, px));
  if (BEND.el) BEND.el.style.transform = `translateY(${clamped}px)`;
  BEND.rate = clamped / BEND.max;                 // -1 .. 1
  if (!BEND.timer) {
    BEND.timer = setInterval(() => {
      if (!BEND.rate) return;
      S.wallScroll = Math.max(0, Math.min(100, S.wallScroll + BEND.rate * 2.5));
    }, 40);
  }
}

function bendRelease() {
  BEND.rate = 0;
  if (BEND.el) BEND.el.style.transform = 'translateY(0px)';
  const track = BEND.el && BEND.el.closest('.pbend');
  if (track) track.classList.remove('held');
  BEND.el = null; BEND.box = null;
  clearInterval(BEND.timer); BEND.timer = null;
  clearTimeout(BEND.settle); BEND.settle = null;
}

document.addEventListener('pointerdown', e => {
  const track = e.target.closest('[data-bend]');
  if (!track) return;
  e.preventDefault();
  BEND.el = track.querySelector('[data-wheel]');
  BEND.box = track.getBoundingClientRect();
  track.classList.add('held');
  track.setPointerCapture && track.setPointerCapture(e.pointerId);
  bendTo(e.clientY - (BEND.box.top + BEND.box.height / 2));
});
document.addEventListener('pointermove', e => {
  if (!BEND.el || !BEND.box) return;
  bendTo(e.clientY - (BEND.box.top + BEND.box.height / 2));
});
['pointerup','pointercancel','pointerleave'].forEach(ev =>
  document.addEventListener(ev, () => { if (BEND.el) bendRelease(); }));

/* ── the scroller's motion ─────────────────────────────────────────────
   Two things a static list does not do: the column glides the live app to
   the band rather than jumping, and the label resolves out of noise when it
   changes — the readout-settling effect that reads as a HUD acquiring a
   target. Both are skipped under prefers-reduced-motion. */
let _lastWall = null;
let _auto = false, _autoT = null, _snapT = null;
const GLYPHS = '▚▞▛▜▙▟◤◥◣◢╱╲┃━┏┓┗┛01';
const _calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function hud() {
  centrePhoneRail();
  const on = document.querySelector('.vsel-i.on');
  if (!on) { _lastWall = null; return; }

  // Centre the column on the band. The padding cannot be a percentage: padding
  // percentages resolve against the containing block's *width*, even vertically,
  // so `calc(50% - 28px)` was half the column's width and every item sat high.
  const list = on.closest('.vsel-list');
  if (list && list.clientHeight) {
    const pad = Math.max(0, (list.clientHeight - on.offsetHeight) / 2);
    if (Math.abs(parseFloat(list.style.paddingTop || 0) - pad) > 0.5) {
      list.style.paddingTop = list.style.paddingBottom = pad + 'px';
    }
    const target = on.offsetTop - (list.clientHeight / 2) + (on.offsetHeight / 2);
    // Flag the programmatic scroll so the picker's own scroll handler does not
    // treat it as the user choosing something — that loop would fight itself.
    _auto = true;
    clearTimeout(_autoT);
    _autoT = setTimeout(() => { _auto = false; }, _calm ? 60 : 520);
    list.scrollTo({ top: target, behavior: _calm ? 'auto' : 'smooth' });
  }

  if (_lastWall === S.wallPage) return;
  const first = _lastWall === null;
  _lastWall = S.wallPage;
  if (_calm || first) return;

  // Resolve the label out of noise. The node is re-queried every tick rather
  // than captured: selecting an app also fires a toast, which re-renders and
  // replaces the element — a held reference would animate a detached node.
  const real = (WALL_APPS.find(a => a.slug === S.wallPage) || {}).title || '';
  if (!real) return;
  let frame = 0;
  clearInterval(hud._t);
  hud._t = setInterval(() => {
    const el = document.querySelector('.vsel-i.on .vsel-t');
    if (!el) { clearInterval(hud._t); return; }
    frame++;
    const settled = Math.floor(frame / 1.6);
    el.textContent = real.split('').map((ch, i) =>
      i < settled || ch === ' ' ? ch : GLYPHS[(Math.random() * GLYPHS.length) | 0]
    ).join('');
    if (settled >= real.length) { clearInterval(hud._t); el.textContent = real; }
  }, 28);
}

/* ── one delegated listener ─────────────────────────────────── */
/* Typing in a search box updates state without a re-render stealing focus:
   we patch the value in place and only re-render the results region. */
/* A navigator you can reach without the mouse. The rail lists what is
   installed; this reaches anything, which is what the Apps page was failing
   to be. */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); S.palette = !S.palette; S.query = ''; render();
  } else if (e.key === 'Escape' && (S.palette || S.sheet)) {
    S.palette = false; S.sheet = null; render();
  }
});

/* Selects fire `change`, not `click`, so these cannot ride the delegated click
   handler. Each mutates state and redraws only what it has to — a full render
   would rebuild the dialog and wipe everything already typed. */
document.addEventListener('change', e => {
  const el = e.target;

  if (el.matches('[data-act="repeatpick"]')) {
    S.repeatChoice = el.value;
    render();                      // the custom row appears or disappears
    const again = document.getElementById('ntR');
    if (again) again.focus();
    return;
  }

});

/* Redrawn in place, never through render(): rebuilding the dialog would wipe
   everything already typed. One function keeps the trigger text and the menu
   rows agreeing — the earlier version updated the chips but not the option
   list, so a removed label could never be added back. */
function redrawLabels() {
  const text = document.getElementById('lblText');
  const menu = document.getElementById('lblMenu');
  if (!text || !menu) return;

  text.textContent = S.newLabels.length ? S.newLabels.join(', ') : 'Add labels…';
  menu.innerHTML =
    LABELS.map(l => {
      const on = S.newLabels.includes(l);
      return `<button type="button" class="lblrow" data-act="toggleLabel" data-v="${l}"
                aria-pressed="${on}"><span class="box">${on ? '✓' : ''}</span>${l}</button>`;
    }).join('')
    + `<button type="button" class="lblrow new" data-act="newLabelInline">＋ New label…</button>`;
}

document.addEventListener('input', e => {
  const f=e.target.closest('[data-act="query"], [data-act="kfind"]'); if(!f) return;
  if (f.dataset.act==='kfind') S.kq=f.value; else S.query=f.value;
  const pos=f.selectionStart; render();
  const again=document.querySelector(`[data-act="${f.dataset.act}"]`);
  if (again) { again.focus(); again.setSelectionRange(pos,pos); }
});

document.addEventListener('click', e => {
  const sg=e.target.closest('.bar .seg button');
  if (sg) {
    const id=sg.parentElement.id, v=sg.dataset.v;
    if(id==='segSurface'){S.surface=v;S.drawer=false;S.sheet=null;S.editing=false;}
    if(id==='segDaypart')S.daypart=v; if(id==='segWeather')S.weather=v;
    return render();
  }
  // Any click outside the member switcher closes it.
  if (S.memberMenu && !e.target.closest('.mewrap')) { S.memberMenu = false; render(); }

  // Any click outside the labels control closes its menu.
  const menu = document.getElementById('lblMenu');
  if (menu && !menu.hasAttribute('hidden') && !e.target.closest('.lblwrap')) {
    menu.setAttribute('hidden', '');
  }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const stop = e.target.closest('[data-stop]');
  if (stop && !stop.contains(el)) return;   // the only action found is the scrim behind it
  const {act,v,id,i}=el.dataset;

  switch(act){
    case 'page': S.page=v; S.drawer=false; S.editing=false; S.memberMenu=false; break;
    case 'todopage': S.todoPage=v; S.query=''; break;
    case 'syspage': S.sysPage=v; break;
    case 'palette': S.palette=true; S.query=''; break;
    case 'wallpower':
      S.wallOn=!S.wallOn;
      toast(S.wallOn ? 'The 24" is on' : 'The 24" is off — this panel stays on');
      break;

    case 'toast': toast(v); break;
    case 'saved': S.saved = S.saved===v ? '' : v; toast(`Filter: ${v}`); break;
    case 'goto':
      S.palette=false; S.query='';
      if (el.dataset.a==='tasks') { S.page='tasks'; S.todoPage=v; }
      else if (el.dataset.a==='sys') { S.page='system'; S.sysPage=v; }
      else { S.page=v; }
      break;
    case 'toggle': { const t=TASKS.find(x=>x.id===+id); t.done=!t.done;
      if(t.done){t.late=false; toast(`Done — ${t.title}`);} break; }
    case 'filter': S.filter=v; break;
    case 'edit': S.editing=!S.editing; break;
    case 'drawer': S.drawer=v==='1'; break;
    case 'sheet': S.sheet=v; break;
    case 'close': S.sheet=null; S.palette=false; break;
    case 'size': BOARD[+i].size=v; break;

    case 'shuffle': {
      // Randomise order AND size. The grid must stay clean regardless — that is
      // the whole claim the size system is making.
      BOARD = BOARD.map(b=>({ k:b.k, size: LIB[b.k].sizes[Math.floor(Math.random()*LIB[b.k].sizes.length)] }))
                   .sort(()=>Math.random()-0.5);
      toast('Shuffled — still tiles clean');
      break;
    }
    case 'add': BOARD.push({k:v, size:LIB[v].sizes[0]}); toast(`${LIB[v].name} added`); break;
    case 'create': {
      const g=id=>document.getElementById(id);
      const repeatText = () => {
        const r = g('ntR').value;
        if (r !== 'Custom…') return r;
        const n = Math.max(1, +g('ntCn').value || 1);
        const unit = g('ntCu').value;
        return `Every ${n === 1 ? unit.replace(/s$/, '') : n + ' ' + unit}`;
      };
      const title=(g('ntT').value||'').trim()||'Untitled task';
      const iso=g('ntD').value;
      const due=iso ? new Date(iso+'T00:00:00').toLocaleDateString('en-GB',
                    {weekday:'short', day:'numeric', month:'short'}) : 'No date';
      const rep=repeatText();
      TASKS.unshift({ id:Date.now(), title, pri:+g('ntP').value, due, late:false,
        who:g('ntW').value==='P'?'P':'N', done:false, mine:true,
        labels:[...S.newLabels], repeat: rep==='Does not repeat'?null:rep,
        esc:0, approver:g('ntA').value||null });
      S.newLabels=[]; S.repeatChoice='Does not repeat';
      S.sheet=null; toast('Task added'); break;
    }
    case 'newLabel': {
      const name = (window.prompt('New label') || '').trim();
      if (name && !LABELS.includes(name)) { LABELS.push(name); toast(`Label “${name}” added`); }
      break;
    }
    case 'memberMenu': S.memberMenu = !S.memberMenu; break;

    case 'beMember':
      S.member = v; S.scope = 'self'; S.memberMenu = false;
      toast(`You are ${me().name}`);
      break;

    case 'scope':
      S.scope = v; S.memberMenu = false;
      toast(v === 'all' ? 'Showing everyone'
                        : 'Showing what the 24-inch is displaying');
      break;

    case 'labelMenu': {
      const menu = document.getElementById('lblMenu');
      if (!menu) return;
      const opening = menu.hasAttribute('hidden');
      if (opening) { redrawLabels(); menu.removeAttribute('hidden'); }
      else menu.setAttribute('hidden', '');
      return;
    }
    case 'toggleLabel': {
      S.newLabels = S.newLabels.includes(v)
        ? S.newLabels.filter(x => x !== v) : [...S.newLabels, v];
      redrawLabels();          // menu stays open — tick several in one go
      return;
    }
    case 'newLabelInline': {
      const name = (window.prompt('New label') || '').trim();
      if (name) {
        if (!LABELS.includes(name)) LABELS.push(name);
        if (!S.newLabels.includes(name)) S.newLabels.push(name);
        redrawLabels();
      }
      return;
    }
    case 'ntlabel': {
      // Toggle in place. Re-rendering would rebuild the dialog and wipe every
      // field the person had already filled in — which is how the typed title
      // came back as "Untitled task".
      S.newLabels = S.newLabels.includes(v)
        ? S.newLabels.filter(x=>x!==v) : [...S.newLabels, v];
      el.setAttribute('aria-pressed', String(S.newLabels.includes(v)));
      return;
    }
    case 'quickdate': {
      const d=new Date('2026-08-09T00:00:00');
      const add=n=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
      const map={ 'Today':add(0), 'Tomorrow':add(1), 'This weekend':add(6),
                  'Next week':add(7), 'No date':'' };
      const el2=document.getElementById('ntD'); if (el2) el2.value = map[v];
      return;   // no re-render: it would wipe what is already typed
    }
    case 'wall': S.wallPage=v; toast(`Wall showing ${v}`); break;
    case 'kctl': toast(`${v} — sent to the wall`); break;

    /* One implementation, whichever surface asked. In the product this is a
       call into the app's own api module — the same one Slack's Done button
       already uses — never a per-surface reimplementation. */
    case 'appaction': {
      const next = live().filter(t=>!t.done)
        .sort((x,y)=>(y.late?1:0)-(x.late?1:0) || x.pri-y.pri)[0];
      if (v==='complete-next' && next) { next.done=true; next.late=false;
        toast(`Done — ${next.title}`); }
      else if (v==='snooze-next' && next) { next.due='In an hour'; next.late=false;
        toast(`Snoozed — ${next.title}`); }
      else if (v==='new-task') { S.sheet='task'; }
      else if (v==='rearrange') { S.editing=!S.editing; toast(S.editing?'Rearranging':'Layout saved'); }
      else if (v==='add-widget') { S.sheet='widget'; }
      else toast('Nothing due');
      break;
    }

    case 'nav': S.navPath=v; toast(`Wall -> ${v}`); break;

    case 'zoom': {
      const z=Math.round((S.dial.zoom + (+el.dataset.d)*ZOOM.step)*100)/100;
      S.dial.zoom=Math.max(ZOOM.min, Math.min(ZOOM.max, z));
      break;
    }
    case 'zoomseek': {
      const r=el.getBoundingClientRect();
      if (r.width) {
        const f=Math.max(0, Math.min(1, (e.clientX-r.left)/r.width));
        const raw=ZOOM.min + f*(ZOOM.max-ZOOM.min);
        S.dial.zoom=Math.round(raw/ZOOM.step)*ZOOM.step;
        S.dial.zoom=Math.round(S.dial.zoom*100)/100;
      }
      break;
    }
    case 'vol': S.dial.volume=Math.max(0, Math.min(100, S.dial.volume + (+el.dataset.d)*5)); break;
    case 'volseek': {
      const r=el.getBoundingClientRect();
      if (r.width) S.dial.volume=Math.round(Math.max(0, Math.min(100,
        ((e.clientX-r.left)/r.width)*100))/5)*5;
      break;
    }
  }
  render();
});

render();
</script>
</body>
</html>
